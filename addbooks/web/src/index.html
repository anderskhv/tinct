<body data-view="start">
<main id="start" hidden></main>

<div id="root" hidden>
<div lang="en" class="lab is-desktop has-page-buttons byob" data-testid="lab-root" data-page-turn-zones="none" data-theme="light" data-lab-layout="desktop" data-chrome-state="reading" data-phone-bar="none" data-reader-ready="true" data-position-resolving="false" data-playing="false" data-fullscreen="false" data-reader-controls="visible" data-compare-active="false" data-desktop-paging="true" data-desktop-view="read" data-desktop-panel="none" data-voice-surface="read" data-voice-version="v2" data-chrome-version="v2" data-transport="closed" data-super-menu="closed" data-super-sheet="closed" style="--lab-font-reader: 'Literata', 'EB Garamond', Georgia, serif; --lab-font-size: 1.3; --lab-line-height: 1.48;">
  <header class="lab-header" id="hdr">
    <button type="button" class="lab-v2-library-back" id="backBtn" aria-label="Back to library"><svg width="20.7" height="20.7" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5.6M11 6.2 5.2 12l5.8 5.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <div class="lab-header-brand">
      <h1 class="lab-header-work"><button type="button" class="lab-header-book" id="bookBtn" aria-label="Contents"><span id="bookTitle">Your book</span></button></h1>
      <span class="lab-title-sep" aria-hidden="true"> · </span>
      <button type="button" class="lab-header-chapter" id="pageBtn" aria-label="Go to page"><span class="lab-header-chapter-label" id="pageLabel">p. 1</span><span class="byob-pg" id="progress">–</span><span class="lab-header-chevron" aria-hidden="true">∨</span></button>
    </div>
    <div class="lab-header-controls">
      <button type="button" class="lab-header-edition" id="textBtn" aria-label="Read as Tinct text" hidden>Tinct text</button>
      <button type="button" class="lab-v2-play" id="playBtn" aria-label="Play"><svg width="20.7" height="20.7" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.6 6.4v11.2L17.8 12 8.6 6.4Z" fill="currentColor" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"></path></svg></button>
      <button type="button" class="lab-super" id="superBtn" data-open="false" aria-label="Menu" aria-expanded="false" aria-haspopup="menu"><span class="lab-super-disc" aria-hidden="true"></span><span class="lab-super-nudge" aria-hidden="true"><span class="lab-super-spin"><span class="lab-super-pulse"><svg class="lab-super-mark" width="27.6" height="27.6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="lab-super-frame" data-frame="0" style="opacity:1"><g transform="matrix(1,0,-0.1944,1,2.333,0)"><path d="M11.40 8.00V13.40C11.40 15.30 12.50 16.10 14.40 15.80"></path><path d="M8.70 10.40H15.00"></path></g></g></svg></span></span></span></button>
    </div>
  </header>
  <div class="lab-body" id="body">
    <div class="pdf-scroll" id="scroll"><div class="pdf-column" id="column"></div></div>
  </div>
  
</div>
</div>
