<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noarchive">
<meta name="theme-color" content="#0b0e0b">
<title>Preparing · Tinct</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/fonts/tinct-fonts.css">
<script type="module" src="/lab/internal-traffic.js"></script>
<style>
/* Preparing (approved paste-flow mockup 04, 5 Nov 2026): after sign-in, the same dark room as the sign-in page,
   the text's own paper cover (book-cover.js paperCover), one line and a hairline of real progress. No spinner,
   no dialog, no library behind it. Then the reader. preparing.js does the work. */
:root{color-scheme:dark;--ink:#eee7d0;--muted:#a9ad9a;--serif:'EB Garamond',Georgia,'Times New Roman',serif;--ui:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0e0b}
body{color:var(--ink);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
.page{position:relative;isolation:isolate;min-height:100dvh;display:flex;flex-direction:column}
.page::before{content:"";position:fixed;inset:-40px;z-index:-2;background:#0b0e0b url(/lab/library_2/assets/room-wide-v2.jpg) 60% 50%/cover no-repeat;filter:blur(14px)}
.page::after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(8,11,9,.78)}
.top{height:72px;display:flex;align-items:center;padding:0 54px;padding-top:env(safe-area-inset-top)}
.logo{font:400 32px/1 var(--serif);letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 72px;text-align:center}
.cover{width:168px;aspect-ratio:2/3;border-radius:3px;box-shadow:0 26px 60px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);display:block;background:#ece5d0}
.cover:not([src]){visibility:hidden}
h1{font:400 32px/1.15 var(--serif);letter-spacing:-.015em;margin:34px 0 18px;color:var(--ink)}
.bar{width:160px;height:2px;border-radius:2px;background:rgba(238,231,208,.16);overflow:hidden}
.bar i{display:block;width:100%;height:100%;background:var(--ink);border-radius:2px;transform-origin:left;transform:scaleX(var(--p,.04));transition:transform .5s ease}
.problem{max-width:440px;margin:0;font:400 17px/1.45 var(--serif);color:var(--ink);text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:7px;font:500 15px/1 var(--ui);text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn.primary{background:#eee5d6;color:#1b1813}
.btn.secondary{background:none;color:var(--ink);border-color:rgba(238,231,208,.4)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #dbd3ae;outline-offset:3px}
@media (max-width:520px){.top{height:60px;padding:0 18px}.logo{font-size:28px}.cover{width:132px}h1{font-size:28px;margin-top:28px}.actions{flex-direction:column;align-self:stretch}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="page">
  <header class="top"><a class="logo" href="/library" aria-label="Tinct library">tinct</a></header>
  <main class="center" role="status" aria-live="polite">
    <img class="cover" id="cover" alt="">
    <h1 id="line">Preparing…</h1>
    <div class="bar" id="bar" aria-hidden="true"><i></i></div>
    <p class="problem" id="problem" hidden></p>
    <div class="actions" id="actions" hidden>
      <button class="btn primary" id="retry" type="button">Try again</button>
      <a class="btn secondary" id="back" href="/byob">Back to your text</a>
    </div>
  </main>
</div>
<script type="module" src="/preparing.js?v=20261109link"></script>
</body>
</html>
