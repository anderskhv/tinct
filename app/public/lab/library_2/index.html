(()=>{const d=document.documentElement;let hint=new URLSearchParams(location.search).get('demo')==='reading';try{const saved=localStorage.getItem('tinct-library-2-reading-table'),positions=localStorage.getItem('tinct-lab-position')||'',signed=/(?:^|;\s*)tinct_auth=1(?:;|$)/.test(document.cookie);if(signed)d.classList.add('signed-in');hint=hint||!!saved||/"books":\{"/.test(positions)||signed;}catch{}if(hint)d.classList.add('returning-pending');const hour=new Date().getHours(),room=hour>=6&&hour<12?'morning':hour>=12&&hour<17?'afternoon':hour>=17&&hour<21?'evening':'night',wide=innerWidth/innerHeight>1.2,scene=hint?'table-'+room:'frankenstein',asset=hint?`assets/${scene}-${wide?'wide':'phone'}.jpg`:`assets/${wide?'room-wide-v2':'room-sharp'}.jpg`;window.__library2Boot={hint,scene,asset};d.dataset.scene=scene;d.style.setProperty('--initial-scene',`url("${asset}")`);const preload=document.createElement('link');preload.rel='preload';preload.as='image';preload.href=asset;preload.fetchPriority='high';document.head.append(preload);if(hint){const bridge=document.createElement('link');bridge.rel='modulepreload';bridge.href='/lab/library-2-reading.js?v=20260926a';document.head.append(bridge);}if(!hint){const cover=document.createElement('link');cover.rel='preload';cover.as='image';cover.href='assets/frankenstein.jpg';cover.fetchPriority='high';document.head.append(cover);}})();

window.__library2Layout=(()=>{let width=0;return()=>{if(innerWidth!==width){width=innerWidth;const bar=/iPhone|iPod/.test(navigator.userAgent)&&innerHeight>screen.height-140?52:0;document.documentElement.style.setProperty('--land-bottom',innerHeight-bar+'px');}const hero=document.getElementById('hero'),book=document.getElementById('hero-book');if(!hero||!book)return;const r=hero.getBoundingClientRect(),copy=document.querySelector('.hero-copy').getBoundingClientRect();document.documentElement.style.setProperty('--hero-height',r.height+'px');if(innerWidth<700){const top=document.getElementById('header').getBoundingClientRect().height+10,available=Math.max(90,copy.top-r.top-top-18),height=Math.min((r.height+parseFloat(getComputedStyle(document.getElementById('shelves')).marginTop||0))*.35,available);book.style.top=top+available-height+'px';book.style.height=height+'px';book.style.bottom='auto';}else{book.style.top='';book.style.height='';book.style.bottom='';}}})();
