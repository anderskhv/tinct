<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, noarchive">
  <meta name="theme-color" content="#111610">
  <title>Your reading · Tinct</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root{color-scheme:dark;--bg:#111610;--cream:#eee7d0;--muted:#b8bea9;--faint:#8c937f;--line:rgba(238,231,208,.18);--gold:#c9b98a;--serif:Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;background:var(--bg);color:var(--cream);font-family:var(--serif)}
    a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:2px solid #dbd3ae;outline-offset:4px}
    [hidden]{display:none!important}
    .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;height:68px;padding:0 max(16px,2.5vw);padding-top:env(safe-area-inset-top);background:#111610e8;backdrop-filter:blur(14px)}
    .back{display:grid;place-items:center;width:40px;height:40px;margin-left:-8px;border-radius:50%;text-decoration:none}
    .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .logo{font-size:30px;letter-spacing:-1.6px;text-decoration:none}
    main{max-width:1180px;margin:0 auto;padding:12px max(16px,2.5vw) 64px}
    .hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:end;padding:28px 0 34px;border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 6px;font-size:16px;font-style:italic;color:var(--muted)}
    .total{margin:0;font-size:clamp(72px,11vw,124px);font-weight:400;line-height:.95;letter-spacing:-.03em;font-variant-numeric:lining-nums}
    .total small{font-size:.42em;letter-spacing:0;margin:0 .12em 0 .02em}
    .lede{margin:16px 0 0;font-size:clamp(19px,2vw,22px);line-height:1.4}
    .lede em{color:var(--muted)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
    .chips li{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font:14px/1.2 var(--sans);color:var(--cream)}
    .actions{display:flex;gap:10px;margin-top:22px}
    .primary{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 22px;border:0;border-radius:999px;background:var(--cream);color:#222b20;font:600 16px/1 var(--sans)}
    .primary:disabled{opacity:.6;cursor:default}
    .secondary{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border:1px solid var(--line);border-radius:999px;font:16px/1 var(--sans);text-decoration:none}
    .note{margin:10px 0 0;font:14px/1.4 var(--sans);color:var(--muted)}
    .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;font-size:15px;color:var(--muted)}
    .chart-head strong{font-weight:400;color:var(--cream)}
    .chart{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:200px}
    .week{display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
    .week .value{font:11px/1.2 var(--sans);color:var(--muted);text-align:center;margin-bottom:4px;white-space:nowrap}
    .week .bar{border-radius:3px 3px 0 0;background:linear-gradient(var(--gold),#8f8160);opacity:.75}
    .week.is-now .bar{background:linear-gradient(#f1e5bd,#d9c99a);opacity:1}
    .week.is-now .value{color:var(--cream);font-weight:600}
    .axis{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;font-style:italic;color:var(--faint)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:30px 0 8px;padding:0;list-style:none}
    .stats li{padding-top:12px;border-top:1px solid var(--line)}
    .stats span{display:block;font:13px/1.3 var(--sans);color:var(--muted)}
    .stats strong{display:block;margin-top:4px;font-size:26px;font-weight:400;font-style:italic}
    .shelf{margin-top:34px}
    .shelf h2{margin:0 0 14px;font:650 21px/1.3 var(--sans)}
    .books{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
    .book{flex:0 0 auto;width:150px;text-decoration:none}
    .cover{display:block;width:150px;aspect-ratio:2/3;border-radius:2px;object-fit:cover;background:#253026;box-shadow:0 10px 20px #0007}
    .paper{display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;font-size:17px;line-height:1.25}
    .meta{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:14px}
    .meta i{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.meta span{flex:0 0 auto;white-space:nowrap}
    .empty{margin:0;font-size:16px;font-style:italic;color:var(--muted)}
    .message{max-width:520px;margin:12vh auto 0;text-align:center}
    .message h1{margin:0 0 10px;font-size:34px;font-weight:400}
    .message p{margin:0 0 22px;font-size:18px;line-height:1.45;color:var(--muted)}
    .message .total{font-size:72px;margin-bottom:8px}
    @media (max-width:760px){
      .hero{grid-template-columns:1fr;gap:30px;padding-top:14px}
      .chart{height:150px;gap:4px}
      .week .value{font-size:10px}
      .stats{grid-template-columns:repeat(2,1fr);gap:16px}
      .book,.cover{width:118px}
    }
  </style>
  <script type="module" src="/lab/display-profile.js"></script>
  <script type="module" src="/lab/internal-traffic.js"></script>
</head>
<body>
  <div id="tinct-your-reading" data-state="loading">
    <header class="top"><a class="back" data-back href="/library" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></a><a class="logo" href="/library">tinct</a></header>
    <main data-main aria-live="polite"></main>
  </div>
  <script type="module" src="/lab/your-reading-runtime.js"></script>
</body>
</html>
