<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#10150f">
  <title>Profiles · Admin · Tinct</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root{color-scheme:dark;--bg:#10150f;--raised:#172015;--ink:#eee7d0;--sage:#b1bba4;--dim:#7f8a76;--gold-hi:#e8d59e;--line:rgba(238,231,208,.13);--glass:rgba(238,231,208,.07);--glass-line:rgba(238,231,208,.16);--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif)}button,input{font:inherit;color:inherit}a{color:inherit}
    [hidden]{display:none!important}
    .admin{max-width:980px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;gap:12px;min-height:48px}
    .top a{text-decoration:none;font:400 20px var(--sans)}
    .top h1{margin:0;font:700 18px var(--sans)}
    section{margin-top:26px}
    h2{margin:0 0 10px;font:700 17px var(--sans);display:flex;gap:8px;align-items:baseline}
    h2 small{color:var(--sage);font:400 14px var(--sans)}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
    .card{border:1px solid var(--glass-line);border-radius:14px;background:var(--glass);padding:12px;display:flex;flex-direction:column;gap:8px}
    .card .who{display:flex;gap:10px;align-items:center}
    .card .who b{display:block;font-weight:400;font-size:17px}.card .who i{display:block;color:var(--sage);font-size:14px}
    .shot{display:block;width:100%;aspect-ratio:2/1;border-radius:10px;background:var(--raised) center/cover no-repeat;border:1px solid var(--line)}
    .shot.round{width:120px;height:120px;aspect-ratio:auto;border-radius:50%;margin:0 auto}
    .label{color:var(--sage);font:400 13px var(--sans)}
    .buttons{display:flex;flex-wrap:wrap;gap:8px}
    .buttons button{min-height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--glass-line);background:transparent;cursor:pointer;font:500 14px var(--sans)}
    .buttons button.yes{background:var(--ink);color:var(--bg);border-color:var(--ink)}
    .buttons button:disabled{opacity:.5}
    .tinct-avatar{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background-color:var(--raised);background-repeat:no-repeat;color:var(--gold-hi);font:400 17px/1 var(--serif);box-shadow:0 0 0 1px var(--glass-line);overflow:hidden;flex:none}
    .tinct-avatar[data-kind=initial]{background-image:linear-gradient(150deg,#2a3a2a,#18241a)}
    .search{display:flex;gap:8px}
    .search input{flex:1;min-width:0;height:42px;padding:0 12px;border:1px solid var(--glass-line);border-radius:10px;background:var(--glass);outline:none}
    .empty{color:var(--sage);font-style:italic;margin:0}
    .tag{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--glass-line);color:var(--sage);font:400 12px var(--sans)}
    .tag.warn{color:#e9a99b;border-color:rgba(233,169,155,.4)}
    .status{min-height:1.2em;color:var(--gold-hi);font:400 14px var(--sans);margin:12px 0 0}
  </style>
  <script type="module" src="/lab/display-profile.js"></script>
</head>
<body>
  <div id="tinct-admin-social" class="admin" data-ready="false">
    <div class="top"><a href="/admin/metrics" aria-label="Back">←</a><h1>Profiles</h1></div>
    <p class="status" role="status" data-status></p>
    <main data-main></main>
  </div>
  <script type="module" src="/lab/admin-social-runtime.js"></script>
</body>
</html>
