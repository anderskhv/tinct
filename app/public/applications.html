<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications — Tinct</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #ece7db; --ink: #0b0b0b; --dim: #6a6555; --accent: #1f4a5c; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    nav { padding: 20px 48px; border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 700; text-decoration: none; color: var(--ink); }
    .logo span { color: var(--accent); }
    .back { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); text-decoration: none; }
    .back:hover { color: var(--accent); }
    main { padding: 120px 48px; max-width: 600px; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 56px; font-weight: 900; letter-spacing: -0.03em; line-height: 0.95; margin-bottom: 32px; }
    p { font-size: 15px; color: var(--dim); line-height: 1.7; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">Tinct<span>.</span></a>
    <a href="/" class="back">← Back</a>
  </nav>
  <main>
    <h1>Appli-<br><em style="font-weight:400;font-style:italic">cations.</em></h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
