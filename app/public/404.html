<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, noarchive">
  <meta name="theme-color" content="#071723">
  <title>Page not found — Tinct</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/fonts/tinct-fonts.css">
  <style>
    :root {
      color-scheme: dark;
      --lib-ground: #071723;
      --lib-cream: #f4eddf;
      --lib-muted: rgba(238, 230, 215, .62);
      --lib-lede: rgba(241, 232, 217, .82);
      --lib-rule-strong: rgba(255, 255, 255, .22);
      --lib-cta-bg: #eee4d1;
      --lib-cta-fg: #16252a;
      --lib-pf: 'Playfair Display', Georgia, serif;
      --lib-serif: 'EB Garamond', Georgia, 'Times New Roman', serif;
      --lib-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      --lib-sans: 'IBM Plex Sans', system-ui, sans-serif;
    }
    html, body { min-height: 100%; background: var(--lib-ground); }
    body {
      margin: 0;
      color: var(--lib-cream);
      font-family: var(--lib-serif);
      -webkit-font-smoothing: antialiased;
    }
    .nf {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    .nf-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .nf-wm {
      font-family: var(--lib-pf);
      font-size: 30px;
      line-height: 1;
      color: var(--lib-cream);
      text-decoration: none;
    }
    .nf-lnk {
      font-family: var(--lib-sans);
      font-size: 15px;
      color: var(--lib-muted);
      text-decoration: none;
    }
    .nf-lnk:hover { color: var(--lib-cream); }
    .nf-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: min(34rem, 100%);
      margin: 0 auto;
      padding: 48px 0;
    }
    .nf-eyebrow {
      font-family: var(--lib-mono);
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--lib-muted);
      margin: 0 0 14px;
    }
    .nf-h1 {
      font-family: var(--lib-pf);
      font-size: clamp(34px, 7vw, 52px);
      line-height: 1.08;
      font-weight: 500;
      margin: 0 0 18px;
    }
    .nf-lede {
      font-size: clamp(18px, 2.4vw, 21px);
      line-height: 1.55;
      color: var(--lib-lede);
      margin: 0 0 32px;
    }
    .nf-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .nf-cta {
      font-family: var(--lib-sans);
      font-size: 16px;
      line-height: 1.2;
      padding: 14px 26px;
      border-radius: 18px;
      background: var(--lib-cta-bg);
      color: var(--lib-cta-fg);
      text-decoration: none;
      white-space: nowrap;
    }
    .nf-ghost {
      font-family: var(--lib-sans);
      font-size: 16px;
      line-height: 1.2;
      padding: 14px 24px;
      border: 1px solid var(--lib-rule-strong);
      border-radius: 18px;
      color: var(--lib-cream);
      text-decoration: none;
      white-space: nowrap;
    }
    .nf-foot {
      font-family: var(--lib-sans);
      font-size: 13px;
      color: var(--lib-muted);
      text-align: center;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="nf">
    <header class="nf-top">
      <a class="nf-wm" href="/">Tinct.</a>
      <a class="nf-lnk" href="/about">About</a>
    </header>
    <div class="nf-body">
      <p class="nf-eyebrow">Error 404</p>
      <h1 class="nf-h1">This page isn’t on the shelf.</h1>
      <p class="nf-lede">The link may be old, or the address mistyped. The library is still here — every book, every edition, right where you left them.</p>
      <div class="nf-actions">
        <a class="nf-cta" href="/library">Browse the library</a>
        <a class="nf-ghost" href="/">Back to the start</a>
      </div>
    </div>
    <p class="nf-foot">Tinct — a new way to read.</p>
  </main>
</body>
</html>
