<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read your own books in Tinct</title>
<meta name="description" content="Read a PDF, an EPUB or an article you paste in Tinct, with the margin reader, Explain, audio narration and Talk. Private to your account.">
<link rel="canonical" href="https://tinct.app/byob">
<meta property="og:title" content="Read your own books in Tinct">
<meta property="og:url" content="https://tinct.app/byob">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tinct">
<meta property="og:description" content="Read a PDF, an EPUB or an article you paste in Tinct, with the margin reader, Explain, audio narration and Talk.">
<meta property="og:image" content="https://tinct.app/og-image-v3.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#13110e">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/fonts/tinct-fonts.css">
<script type="module" src="/lab/internal-traffic.js"></script>
<style>
/* Anders's "Book spread" design (approved 5 Nov 2026): a dark page on the left, the library's room on the right.
   On a phone the room fills the screen and the page is a sheet over it. Tinct's own fonts and the library's painting. */
:root{--bg:#13110e;--ink:#eee7d0;--muted:#c9c3b2;--line:rgba(238,231,208,.26);--line2:rgba(238,231,208,.4);--btn:#eee5d6;--btn-ink:#1b1813;--focus:#dbd3ae;--serif:'EB Garamond',Georgia,'Times New Roman',serif;--ui:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.spread{display:grid;grid-template-columns:minmax(440px,600px) 1fr;min-height:100dvh}
.room{grid-column:2;grid-row:1;position:relative;background:#0b0d0b url(/lab/library_2/assets/room-wide-v2.jpg) 78% 50%/cover no-repeat}
.room::after{content:"";position:absolute;inset:0;background:linear-gradient(#0007,transparent 18%)}
.page{grid-column:1;grid-row:1;display:flex;flex-direction:column;padding:44px 64px 40px;padding-left:max(64px,env(safe-area-inset-left));min-height:100dvh}
.logo{font:500 30px/1 var(--serif);letter-spacing:-.5px;text-decoration:none;align-self:flex-start}
.nav{position:absolute;z-index:2;top:40px;right:56px;display:flex;gap:34px;font:18px var(--serif)}
.nav a{text-decoration:none;text-shadow:0 1px 8px #0009}.nav a:hover{text-decoration:underline;text-underline-offset:4px}
.body{margin:auto 0;padding:48px 0}
h1{font:400 clamp(52px,5vw,72px)/1.02 var(--serif);letter-spacing:-.025em;margin:0;text-wrap:balance}
.sub{font-size:17px;line-height:1.6;color:var(--muted);margin:26px 0 30px;max-width:440px}
.drop{border:1px dashed var(--line);border-radius:12px;padding:20px 24px 22px;max-width:472px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--ink);background:#eee7d00d}
.drop-title{display:flex;align-items:center;gap:14px;font:400 22px var(--serif);margin:0 0 16px}
.drop-title svg,.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btns{display:flex;gap:10px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:7px;font:500 15px/1 var(--ui);cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.secondary{background:none;color:var(--ink);border-color:var(--line2)}
.btn.secondary:hover{background:#eee7d00f}
.btn:disabled{opacity:.55;cursor:default}
.status{margin:12px 0 0;font-size:14px;color:var(--muted)}.status:empty{margin:0}
.foot{margin:0;font-size:14px;color:var(--muted)}.foot a{color:var(--ink);text-underline-offset:3px}
.phone-top{display:none}
@media (max-width:860px){
  .spread{display:flex;flex-direction:column;min-height:100dvh;position:relative}
  .room{position:fixed;inset:0;background-image:url(/lab/library_2/assets/room-wide-v2.jpg);background-position:72% 30%}
  .nav{display:none}
  .phone-top{display:flex;position:relative;z-index:2;justify-content:space-between;align-items:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
  .phone-top a{font:17px var(--serif);text-decoration:none;text-shadow:0 1px 8px #0009}
  .phone-top .logo{font-size:28px}
  .page{flex:1 0 auto;position:relative;z-index:2;min-height:0;margin-top:max(42vh,280px);padding:30px max(20px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -20px 50px #0009}
  .page>.logo{display:none}
  .body{margin:0;padding:0}
  h1{font-size:clamp(36px,11vw,46px)}
  .sub{font-size:15.5px;margin:16px 0 22px}
  .drop{border:0;padding:0;max-width:none}
  .drop-title{display:none}
  .foot{margin-top:22px}
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="spread">
  <div class="room" aria-hidden="true"></div>
  <nav class="nav" aria-label="Tinct"><a href="/library">Library</a><a id="account" href="/sign-in?returnTo=%2Fbyob">Sign in</a></nav>
  <div class="phone-top"><a class="logo" href="/" aria-label="Tinct home">tinct</a><a id="account-phone" href="/sign-in?returnTo=%2Fbyob">Sign in</a></div>
  <main class="page">
    <a class="logo" href="/" aria-label="Tinct home">tinct</a>
    <div class="body">
      <h1>Your own books, texts and PDFs.</h1>
      <p class="sub">Bring any PDF, EPUB or simply paste text from an article. Explain any passage, listen to it, talk it through.</p>
      <div class="drop" id="drop">
        <p class="drop-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>Drag your file here</p>
        <div class="btns"><button class="btn primary" id="choose" type="button">Choose a file</button><button class="btn secondary" id="paste" type="button">Paste text</button></div>
        <p class="status" id="status" role="status"></p>
        <input id="file" type="file" accept=".pdf,.epub,.txt,application/pdf,application/epub+zip,text/plain" hidden>
      </div>
    </div>
    <p class="foot">Already reading? <a href="/library">Open your Library</a></p>
  </main>
</div>
<script type="module" src="/byob.js?v=20261105spread"></script>
</body>
</html>
