<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/fonts/tinct-fonts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #ece7db;
      color: #0b0b0b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
    }
    .wordmark {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 900;
      font-size: 148px;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #0b0b0b;
    }
    .wordmark .dot { color: #1f4a5c; }
    .rule {
      width: 220px;
      height: 3px;
      background: #1f4a5c;
      margin: 44px auto 36px;
    }
    .tagline {
      font-family: 'EB Garamond', Georgia, serif;
      font-style: italic;
      font-size: 42px;
      color: #0b0b0b;
      opacity: 0.82;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark">Tinct<span class="dot">.</span></div>
    <div class="rule"></div>
    <div class="tagline">The classics, in your language.</div>
  </div>
</body>
</html>
