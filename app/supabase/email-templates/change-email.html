<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #f3efe9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f3efe9; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background-color: #faf8f5; border-radius: 4px; box-shadow: 0 1px 3px rgba(44,36,23,0.06); padding: 48px 40px;">
          <tr>
            <td>
              <h1 style="font-family: Georgia, 'Times New Roman', serif; font-size: 24px; color: #2c2417; margin: 0 0 8px 0; font-weight: normal;">Tinct</h1>
              <p style="font-size: 14px; color: #9a8b7a; margin: 0 0 32px 0; border-bottom: 1px solid rgba(44,36,23,0.06); padding-bottom: 24px;">Confirm email change</p>

              <p style="font-size: 15px; color: #2c2417; line-height: 1.6; margin: 0 0 16px 0;">You've requested to change your email address.</p>
              <p style="font-size: 15px; color: #6b5d4f; line-height: 1.6; margin: 0 0 28px 0;">Please confirm this change by clicking the button below.</p>

              <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #2c2417; color: #faf8f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; text-decoration: none; padding: 12px 32px; border-radius: 3px;">Confirm email change</a>

              <p style="font-size: 13px; color: #9a8b7a; line-height: 1.6; margin: 32px 0 0 0; border-top: 1px solid rgba(44,36,23,0.06); padding-top: 24px;">If you didn't request this change, please secure your account by resetting your password.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
