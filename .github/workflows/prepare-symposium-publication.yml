name: Prepare and verify Symposium completeness
on:
  push:
    branches: [codex/symposium-publication-20260925]
permissions:
  contents: write
concurrency:
  group: symposium-publication-preparation
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/symposium-publication-20260925
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: python3 scripts/prepare-symposium-release.py
      - run: python3 ../books/wip_inventory.py
      - run: node scripts/split-edition-chapters.cjs --write-registry symposium-original-en symposium-modern-en
      - run: npm test
      - run: npm run build
      - run: npm run verify-bundle
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify restored opening, Compare and saved annotations
        env:
          TEST_BOOK: symposium
          ARTIFACT_DIR: artifacts/symposium-release
        run: node scripts/check-book-publication.cjs
      - name: Verify independently reviewed cards in both editions
        env:
          TEST_BOOK: symposium
          TEST_ORIGIN: https://tinct.app
          READER_BUILT: '1'
          ARTIFACT_DIR: artifacts/symposium-release
        run: node scripts/check-symposium-characters.cjs
      - name: Commit generated integration for independent final review
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/editions/symposium-*.json public/data/editions-chapters/symposium-original-en public/data/editions-chapters/symposium-modern-en public/data/characters/symposium.v1.json public/data/edition-migrations/symposium.*.json src/data/symposiumCoordinateMap.json src/data/editionShardRegistry.ts public/read/symposium public/sitemap.xml src/data/bookMetaGenerated.ts ../books/characters/symposium/characters.v1.json ../books/wip/symposium-publication-20260925
          git diff --cached --quiet || git commit -m "content: integrate pinned Symposium completeness assets and maps"
          git push origin HEAD:codex/symposium-publication-20260925
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: symposium-release-acceptance
          path: |
            books/wip/symposium-publication-20260925
            app/artifacts/symposium-release
