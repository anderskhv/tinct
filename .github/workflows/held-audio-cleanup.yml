name: Retire held edition legacy audio
on:
  push:
    branches: [codex/held-audio-cleanup-20260926]
    paths: ['app/scripts/retire-held-audio.py', '.github/workflows/held-audio-cleanup.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: held-edition-audio-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: held-audio-inventory
          run-id: 36251091359
          github-token: ${{ github.token }}
          path: app/artifacts/held-audio-source
      - name: Verify exact inventory (no deletion)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 app/scripts/retire-held-audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: held-audio-cleanup-receipt
          path: app/artifacts/held-audio-cleanup
