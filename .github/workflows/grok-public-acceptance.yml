name: Verify public Grok audiobooks
on:
  push:
    branches: [codex/grok-public-acceptance-20260923]
    paths: [.github/workflows/grok-public-acceptance.yml]
permissions:
  contents: read
jobs:
  public-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: bash ../scripts/cloud-setup.sh
      - run: npm run build
      - run: node scripts/plan-grok-openings.mjs
      - name: Verify prepared openings without synthesis
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          NARRATION_CACHE_ONLY: '1'
        run: |
          npx esbuild scripts/warm-grok-openings.mjs --bundle --platform=node --format=esm --outfile=/tmp/tinct-verify-openings.mjs
          node /tmp/tinct-verify-openings.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify actual public playback without sign-in
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_RELEASE_STAGE: '0'
        run: node scripts/check-grok-reader.mjs
      - name: Verify live dark reader fold
        env:
          READER_LIVE: '1'
        run: node scripts/check-reader-fold.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-public-acceptance
          path: |
            app/artifacts/grok-openings
            app/artifacts/reader-fold

