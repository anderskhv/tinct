name: Reader release diagnostics
on:
  pull_request:
    paths:
      - 'app/scripts/check-omarchy.mjs'
      - '.github/workflows/reader-release-diagnostics.yml'
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: npx playwright install --with-deps chromium webkit
      - run: TINCT_DESKTOP_LIVE=1 node scripts/check-omarchy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-release-network
          path: app/artifacts/omarchy
