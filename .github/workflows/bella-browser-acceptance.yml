name: bella-muted-production-acceptance
on:
  push:
    branches: ['codex/bella-browser-acceptance-20260921']
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: node tools/audio-highlight/bella_browser_acceptance.cjs
      - if: always()
        run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          git add -f artifacts/bella-browser-acceptance-2026-09-21/results.json
          git diff --cached --quiet && exit 0
          git commit -m "Record isolated muted production audio acceptance [skip ci]"
          git push origin HEAD:codex/bella-browser-acceptance-20260921
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bella-muted-browser-acceptance
          path: artifacts/bella-browser-acceptance-2026-09-21
