name: Verify structural migration core
on:
  push:
    branches: [codex/edition-structure-migration-20260924]
    paths: ['app/src/data/editionCoordinateMigration*', '.github/workflows/verify-structure-migration.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: npx vitest run src/data/editionCoordinateMigration.test.ts
