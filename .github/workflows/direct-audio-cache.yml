name: Direct reader audio cache
on:
  pull_request:
    paths: ['app/public/sw.js', 'app/src/main.tsx', 'app/src/utils/registerReaderOffline*', 'app/src/utils/serviceWorkerAudio.test.ts', 'app/scripts/check-direct-audio-cache.mjs', '.github/workflows/direct-audio-cache.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: CI=true npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-direct-audio-cache.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-audio-cache
          path: app/artifacts/direct-audio-cache
