name: Direct reader audio cache
on:
  pull_request:
    paths: ['app/public/sw.js', 'app/src/main.tsx', 'app/src/utils/registerReaderOffline*', 'app/src/utils/serviceWorkerAudio.test.ts', 'app/scripts/check-direct-audio-cache.mjs', 'app/scripts/check-live-reader-cache.mjs', '.github/workflows/direct-audio-cache.yml']
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - if: github.event_name != 'workflow_run'
        run: CI=true npm run build
      - run: npx playwright install --with-deps chromium
      - if: github.event_name != 'workflow_run'
        run: node scripts/check-direct-audio-cache.mjs
      - if: github.event_name == 'workflow_run'
        run: node scripts/check-live-reader-cache.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-audio-cache
          path: app/artifacts/direct-audio-cache
