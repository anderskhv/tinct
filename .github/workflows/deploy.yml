name: deploy

# Staged release (see "Deploy flow" in AGENTS.md):
#   test -> upload a Worker Version that serves no traffic -> smoke + acceptance
#   against its preview URL -> promote to 100% -> production-only checks ->
#   automatic rollback to the previous version if any post-promote step fails.
# A change to the Durable Object "migrations" list cannot ride a version upload,
# so that (and workflow_dispatch mode=direct) takes the classic deploy path.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'staged = preview then promote (default); direct = classic deploy, acceptance after it is live'
        type: choice
        options:
          - direct
          - staged
        default: direct

permissions:
  contents: read

concurrency:
  group: deploy-tinct-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Origin the acceptance scripts hit. Points at the version preview URL until
      # promotion, then at production. Scripts default to https://tinct.app.
      TINCT_ORIGIN: https://tinct.app
      TEST_ORIGIN: https://tinct.app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up cloud checkout
        run: bash ../scripts/cloud-setup.sh
      - run: npm test

      - name: Choose release mode
        id: plan
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          # Direct is the default: Cloudflare gives no preview URL to a Worker
          # with Durable Objects, so a staged release cannot test before promote.
          # Direct deploys record the previous version and roll back
          # automatically if any acceptance step fails afterwards.
          mode=direct
          reason='direct deploy with automatic rollback'
          if [ "$REQUESTED_MODE" = staged ]; then
            mode=staged
            reason='staged release (requested)'
            changed=$(node scripts/release-tools.cjs migrations-changed "$BASE_SHA" | sed 's/^changed=//')
            if [ "$changed" != false ]; then
              mode=direct
              reason="Durable Object migrations changed or could not be compared (changed=$changed)"
            elif ! git diff --quiet "$BASE_SHA" HEAD -- wrangler.jsonc; then
              # Worker settings (routes, preview URLs, bindings) apply through a full deploy.
              mode=direct
              reason='wrangler.jsonc changed'
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Release mode: $mode ($reason)"
          echo "Release mode: **$mode** ($reason)" >> "$GITHUB_STEP_SUMMARY"

      # ---- Stage 1: get the new build somewhere testable -------------------

      - name: Record the version currently serving production
        id: previous
        continue-on-error: true
        run: node scripts/release-tools.cjs current-version >> "$GITHUB_OUTPUT"

      - name: Upload new Worker Version (serves no traffic)
        if: steps.plan.outputs.mode == 'staged'
        id: upload
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npm run release:upload
          node scripts/release-tools.cjs parse-upload "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"

      - name: Point acceptance at the version preview URL
        if: steps.plan.outputs.mode == 'staged'
        id: preview
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            # Never stall releases: deploy directly (acceptance then runs on production, as before).
            echo '::warning::wrangler returned no preview URL; falling back to a direct deploy. Check preview_urls in wrangler.jsonc and the Worker settings.'
            echo 'fallback=true' >> "$GITHUB_OUTPUT"
            echo 'Release mode: **direct (no preview URL)**' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "TINCT_ORIGIN=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "TEST_ORIGIN=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview: $PREVIEW_URL (version ${{ steps.upload.outputs.version_id }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Workers (direct mode)
        if: steps.plan.outputs.mode == 'direct' || steps.preview.outputs.fallback == 'true'
        id: deploy
        run: |
          # A staged upload that fell back has already built; the build rewrites
          # generated files, which the clean-checkout guard would refuse.
          if [ "${{ steps.preview.outputs.fallback }}" = true ]; then git checkout -- .; fi
          npm run deploy

      - name: Record deployed bundle hash
        id: bundle
        run: |
          bundle=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/app.html | head -1)
          test -n "$bundle"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      # Confirm the exact build we uploaded, not any previously served bundle.
      - name: Wait for the new bundle to be served
        run: |
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/app.html | head -1)
          test -n "$expected"
          for attempt in $(seq 1 30); do
            bundle=$(curl -sf "$TINCT_ORIGIN/reader" \
              | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ "$bundle" = "$expected" ] && curl -sf "$TINCT_ORIGIN$bundle" -o /tmp/tinct-live-bundle.js \
                 && cmp -s "dist$expected" /tmp/tinct-live-bundle.js; then
              echo "serving verified $bundle at $TINCT_ORIGIN after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::expected bundle was not verified at $TINCT_ORIGIN after 150s"
          exit 1

      # ---- Stage 2: acceptance against the not-yet-live version ------------
      # In direct mode these same steps run against production (legacy behavior).

      - name: Smoke test
        env:
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: bash scripts/smoke-test.sh "$TINCT_ORIGIN"

      - name: Verify published Android book downloads
        run: node scripts/android/check-publication.mjs "$TINCT_ORIGIN"

      - name: Install silent browser
        id: browser
        run: npx playwright install --with-deps chromium webkit
      - name: Verify Omarchy commands and themes
        env:
          TINCT_DESKTOP_LIVE: '1'
          TINCT_DESKTOP_VISUAL: '1'
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: node scripts/check-omarchy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omarchy-production-acceptance
          path: app/artifacts/omarchy
      - name: Verify inline audio loading silently
        env:
          READER_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: node scripts/check-inline-audio-loading.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-audio-loading
          path: app/artifacts/inline-audio-loading
      - name: Verify reader panels and selection
        env:
          READER_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: node scripts/check-reader-panels.mjs
      - name: Verify reader feedback fixes
        env:
          READER_LIVE: '1'
        run: node scripts/check-reader-feedback.mjs
      - name: Verify spoken Bible book transition silently
        env:
          READER_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: node scripts/check-book-transition.mjs
      - name: Save reader acceptance screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-panels-acceptance
          path: |
            app/artifacts/reader-panels
            app/artifacts/reader-feedback-20260928
            app/artifacts/book-transition
      - name: Verify Shakespeare layout
        env:
          SHAKESPEARE_LIVE: '1'
        run: node scripts/check-shakespeare-layout.mjs
      - name: Verify hyphenation hardening
        env:
          HYPHENATION_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: node scripts/check-hyphenation-hardening.mjs
      - name: Verify Lighthouse publication
        env:
          TEST_BOOK: to-the-lighthouse
          READER_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
          ARTIFACT_DIR: artifacts/lighthouse-publication-live
        run: |
          node scripts/check-book-publication.cjs
          node scripts/check-lighthouse-characters.cjs
      - name: Verify Symposium completeness
        env:
          TEST_BOOK: symposium
          READER_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
          ARTIFACT_DIR: artifacts/symposium-publication-live
        run: |
          node scripts/check-book-publication.cjs
          node scripts/check-symposium-characters.cjs
      - name: Save pre-promote acceptance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-promote-acceptance
          path: |
            app/artifacts/shakespeare-layout
            app/artifacts/hyphenation-hardening
            app/artifacts/lighthouse-publication-live
            app/artifacts/symposium-publication-live

      # ---- Stage 3: promote, then verify what only production can prove ----

      - name: Promote the version to 100% of production traffic
        if: steps.plan.outputs.mode == 'staged' && steps.preview.outputs.fallback != 'true'
        id: promote
        run: npm run release:promote -- "${{ steps.upload.outputs.version_id }}"

      - name: Point acceptance at production
        run: |
          echo 'TINCT_ORIGIN=https://tinct.app' >> "$GITHUB_ENV"
          echo 'TEST_ORIGIN=https://tinct.app' >> "$GITHUB_ENV"

      - name: Confirm production serves the new bundle
        if: steps.plan.outputs.mode == 'staged' && steps.preview.outputs.fallback != 'true'
        run: |
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/app.html | head -1)
          for attempt in $(seq 1 30); do
            bundle=$(curl -sf https://tinct.app/reader \
              | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ "$bundle" = "$expected" ]; then
              echo "production serves $bundle after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo '::error::production did not start serving the promoted bundle within 150s'
          exit 1

      - name: Smoke test production
        env:
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: bash scripts/smoke-test.sh https://tinct.app

      - name: Verify production brand metadata and assets
        run: node scripts/check-brand.mjs

      - name: Verify production sign-in completion without real accounts
        run: AUTH_LIVE=1 node scripts/check-sign-in.mjs
      - name: Save production sign-in acceptance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sign-in-acceptance
          path: app/artifacts/sign-in
      - name: Verify real Grok microphone recovery silently
        if: ${{ !cancelled() && steps.bundle.outputs.path != '' && contains(github.event.head_commit.message, '[reader-voice-qa]') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -s 175 -w /tmp/tinct-voice-source.wav "Why does the Underground Man call himself sick? What is behind that?"
          python3 scripts/make-voice-qa-wav.py /tmp/tinct-voice-source.wav /tmp/tinct-voice-qa.wav
          READER_LIVE=1 node scripts/grok-capture-acceptance.mjs /tmp/tinct-voice-qa.wav
      - name: Verify production featured-book preview
        run: LIBRARY_LIVE=1 node scripts/check-featured-preview.mjs
      - name: Verify public cinematic library
        run: LIBRARY_LIVE=1 node scripts/check-library-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-library-preparation
          path: |
            app/artifacts/brand
            app/artifacts/voice-capture
            app/artifacts/featured-preview
            app/artifacts/library-public

      # ---- Automatic rollback ----------------------------------------------
      # Reached only when the promote step succeeded and a later step failed.
      # The job still ends red; this just stops users staying on a bad version.

      - name: Roll production back to the previous version
        if: ${{ failure() && (steps.promote.outcome == 'success' || steps.deploy.outcome == 'success') }}
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version_id }}
        run: |
          echo "::error::a check failed after the new version went live; rolling back to ${PREVIOUS_VERSION:-the previous deployment}"
          npm run rollback -- "$PREVIOUS_VERSION"
          echo "Rolled back to ${PREVIOUS_VERSION:-the previous deployment}. Fix forward, then push again." >> "$GITHUB_STEP_SUMMARY"
