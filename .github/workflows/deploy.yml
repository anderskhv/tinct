name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-tinct-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CI: true
      - run: npm run verify-bundle

      - name: Record deployed bundle hash
        id: bundle
        run: |
          bundle=$(grep -oE '/assets/index-[^"]+\.js' dist/app.html | head -1)
          if [ -z "$bundle" ]; then
            echo '::error::could not read bundle hash from dist/app.html'
            exit 1
          fi
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "Deployed bundle: $bundle"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler returns before Cloudflare finishes serving the new assets. Production
      # HTML can briefly reference a different hash than the one we just uploaded, so
      # wait on the bundle from dist/app.html — not whatever /reader returns.
      - name: Wait for the new bundle to be served
        run: |
          bundle="${{ steps.bundle.outputs.path }}"
          for attempt in $(seq 1 30); do
            if curl -sf "https://tinct.app$bundle" \
                 | head -c 200 | grep -qE 'var |function |const |import |Object\.'; then
              echo "serving $bundle after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::deployed bundle $bundle was not served after 150s"
          exit 1

      - name: Smoke test production
        env:
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: bash scripts/smoke-test.sh https://tinct.app
