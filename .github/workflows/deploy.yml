name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-tinct-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CI: true
      - run: npm run verify-bundle

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Confirm the exact build we deployed, not any previously served bundle.
      - name: Wait for the new bundle to be served
        run: |
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/app.html | head -1)
          test -n "$expected"
          for attempt in $(seq 1 30); do
            bundle=$(curl -sf https://tinct.app/reader \
              | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ "$bundle" = "$expected" ] && curl -sf "https://tinct.app$bundle" -o /tmp/tinct-live-bundle.js \
                 && cmp -s "dist$expected" /tmp/tinct-live-bundle.js; then
              echo "serving verified $bundle after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo '::error::expected bundle was not verified after 150s'
          exit 1

      - name: Smoke test production
        run: bash scripts/smoke-test.sh https://tinct.app
