name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tinct-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up cloud checkout
        run: bash ../scripts/cloud-setup.sh
      - run: npm test

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployed bundle hash
        id: bundle
        run: |
          bundle=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/app.html | head -1)
          test -n "$bundle"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      # Confirm the exact build we deployed, not any previously served bundle.
      - name: Wait for the new bundle to be served
        run: |
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/app.html | head -1)
          test -n "$expected"
          for attempt in $(seq 1 30); do
            bundle=$(curl -sf https://tinct.app/reader \
              | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ "$bundle" = "$expected" ] && curl -sf "https://tinct.app$bundle" -o /tmp/tinct-live-bundle.js \
                 && cmp -s "dist$expected" /tmp/tinct-live-bundle.js; then
              echo "serving verified $bundle after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo '::error::expected bundle was not verified after 150s'
          exit 1

      - name: Smoke test production
        env:
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: bash scripts/smoke-test.sh https://tinct.app

      - name: Install silent production browser
        run: npx playwright install --with-deps chromium webkit
      - name: Verify production reader panels and selection
        env:
          READER_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: node scripts/check-reader-panels.mjs
      - name: Save reader acceptance screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-panels-acceptance
          path: app/artifacts/reader-panels
      - name: Verify real Grok microphone recovery silently
        if: ${{ !cancelled() && steps.bundle.outputs.path != '' && contains(github.event.head_commit.message, '[reader-voice-qa]') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -s 175 -w /tmp/tinct-voice-source.wav "Why does the Underground Man call himself sick? Explain in detail over several paragraphs."
          python3 scripts/make-voice-qa-wav.py /tmp/tinct-voice-source.wav /tmp/tinct-voice-qa.wav
          READER_LIVE=1 node scripts/grok-capture-acceptance.mjs /tmp/tinct-voice-qa.wav
      - name: Verify production library and preparation
        run: LIBRARY_LIVE=1 node scripts/check-library-layout.mjs
      - name: Verify responsive landing and library
        run: LIBRARY_LIVE=1 node scripts/check-entry-responsive.mjs
      - name: Verify production hyphenation hardening
        env:
          HYPHENATION_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: node scripts/check-hyphenation-hardening.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-library-preparation
          path: |
            app/artifacts/voice-capture
            app/artifacts/library-layout
            app/artifacts/entry-responsive
            app/artifacts/hyphenation-hardening
