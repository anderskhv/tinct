name: deploy

# Staged release (see "Deploy flow" in AGENTS.md):
#   test -> upload a Worker Version that serves no traffic -> smoke + acceptance
#   against its preview URL -> promote to 100% -> production-only checks ->
#   automatic rollback to the previous version if any post-promote step fails.
# A change to the Durable Object "migrations" list cannot ride a version upload,
# so that (and workflow_dispatch mode=direct) takes the classic deploy path.
#
# The acceptance checks are independent of each other, so they run side by side, one job per group (`checks`,
# `production-checks`), each on the exact build the deploy job made (its dist/, handed over as an artifact).
# Direct mode (the default): every group runs at once against production. Staged mode: the pre-promote groups
# run against the preview, then promote, then the production groups. `rollback` returns production to the version
# that served it before whenever the new build went live and any check did not pass.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'staged = preview then promote (default); direct = classic deploy, acceptance after it is live'
        type: choice
        options:
          - direct
          - staged
        default: direct

permissions:
  contents: read

concurrency:
  group: deploy-tinct-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 30: the acceptance checks (and their browser installs) now run in their own jobs.
    timeout-minutes: 30
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Origin the acceptance scripts hit. Points at the version preview URL until
      # promotion, then at production. Scripts default to https://tinct.app.
      TINCT_ORIGIN: https://tinct.app
      TEST_ORIGIN: https://tinct.app
    defaults:
      run:
        working-directory: app
    outputs:
      # 'true' once the new build serves production (direct deploy): from then on a failure rolls back.
      live: ${{ steps.deploy.outputs.live }}
      # staged = a preview to test before promotion; direct = acceptance runs on production.
      staged: ${{ steps.plan.outputs.mode == 'staged' && steps.preview.outputs.fallback != 'true' }}
      origin: ${{ steps.handoff.outputs.origin }}
      bundle: ${{ steps.bundle.outputs.path }}
      previous_version: ${{ steps.previous.outputs.version_id }}
      version_id: ${{ steps.upload.outputs.version_id }}
      groups: ${{ steps.handoff.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up cloud checkout
        run: bash ../scripts/cloud-setup.sh
      - run: npm test

      - name: Choose release mode
        id: plan
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          # Direct is the default: Cloudflare gives no preview URL to a Worker
          # with Durable Objects, so a staged release cannot test before promote.
          # Direct deploys record the previous version and roll back
          # automatically if any acceptance step fails afterwards.
          mode=direct
          reason='direct deploy with automatic rollback'
          if [ "$REQUESTED_MODE" = staged ]; then
            mode=staged
            reason='staged release (requested)'
            changed=$(node scripts/release-tools.cjs migrations-changed "$BASE_SHA" | sed 's/^changed=//')
            if [ "$changed" != false ]; then
              mode=direct
              reason="Durable Object migrations changed or could not be compared (changed=$changed)"
            elif ! git diff --quiet "$BASE_SHA" HEAD -- wrangler.jsonc; then
              # Worker settings (routes, preview URLs, bindings) apply through a full deploy.
              mode=direct
              reason='wrangler.jsonc changed'
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Release mode: $mode ($reason)"
          echo "Release mode: **$mode** ($reason)" >> "$GITHUB_STEP_SUMMARY"

      # ---- Stage 1: get the new build somewhere testable -------------------

      - name: Record the version currently serving production
        id: previous
        continue-on-error: true
        run: node scripts/release-tools.cjs current-version >> "$GITHUB_OUTPUT"

      - name: Upload new Worker Version (serves no traffic)
        if: steps.plan.outputs.mode == 'staged'
        id: upload
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npm run release:upload
          node scripts/release-tools.cjs parse-upload "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"

      - name: Point acceptance at the version preview URL
        if: steps.plan.outputs.mode == 'staged'
        id: preview
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            # Never stall releases: deploy directly (acceptance then runs on production, as before).
            echo '::warning::wrangler returned no preview URL; falling back to a direct deploy. Check preview_urls in wrangler.jsonc and the Worker settings.'
            echo 'fallback=true' >> "$GITHUB_OUTPUT"
            echo 'Release mode: **direct (no preview URL)**' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "TINCT_ORIGIN=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "TEST_ORIGIN=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Preview: $PREVIEW_URL (version ${{ steps.upload.outputs.version_id }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Workers (direct mode)
        if: steps.plan.outputs.mode == 'direct' || steps.preview.outputs.fallback == 'true'
        id: deploy
        run: |
          # A staged upload that fell back has already built; the build rewrites
          # generated files, which the clean-checkout guard would refuse.
          if [ "${{ steps.preview.outputs.fallback }}" = true ]; then git checkout -- .; fi
          npm run deploy
          echo 'live=true' >> "$GITHUB_OUTPUT"

      - name: Record deployed bundle hash
        id: bundle
        run: |
          bundle=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/app.html | head -1)
          test -n "$bundle"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"

      # Confirm the exact build we uploaded, not any previously served bundle.
      - name: Wait for the new bundle to be served
        run: |
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/app.html | head -1)
          test -n "$expected"
          for attempt in $(seq 1 30); do
            bundle=$(curl -sf "$TINCT_ORIGIN/reader" \
              | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ "$bundle" = "$expected" ] && curl -sf "$TINCT_ORIGIN$bundle" -o /tmp/tinct-live-bundle.js \
                 && cmp -s "dist$expected" /tmp/tinct-live-bundle.js; then
              echo "serving verified $bundle at $TINCT_ORIGIN after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::expected bundle was not verified at $TINCT_ORIGIN after 150s"
          exit 1

      # The checks run on the exact files that were deployed (some compare production with dist/).
      - name: Hand the deployed build to the checks
        id: handoff
        env:
          STAGED: ${{ steps.plan.outputs.mode == 'staged' && steps.preview.outputs.fallback != 'true' }}
        run: |
          tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/deployed-dist.tar.zst" dist
          echo "origin=$TINCT_ORIGIN" >> "$GITHUB_OUTPUT"
          # Direct: production is already live, so every group runs now. Staged: only the pre-promote groups.
          if [ "$STAGED" = true ]; then
            echo 'groups=["reader-panels","page-layout","publication","audio-smoke"]' >> "$GITHUB_OUTPUT"
          else
            echo 'groups=["reader-panels","page-layout","publication","audio-smoke","library","production"]' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-dist
          path: ${{ runner.temp }}/deployed-dist.tar.zst
          retention-days: 1
          compression-level: 0

  # ---- Stage 2: acceptance (pre-promote groups; in direct mode every group, on production) ----
  checks:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.deploy.outputs.groups) }}
    name: checks (${{ matrix.group }})
    env:
      CI: true
      TINCT_ORIGIN: ${{ needs.deploy.outputs.origin }}
      TEST_ORIGIN: ${{ needs.deploy.outputs.origin }}
      BUNDLE: ${{ needs.deploy.outputs.bundle }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
          browsers: chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: deployed-dist
          path: ${{ runner.temp }}
      - name: Unpack the deployed build
        run: tar -I zstd -xf "$RUNNER_TEMP/deployed-dist.tar.zst"
      # A re-run of this job alone after a rollback would test the previous version: refuse, and say what to do.
      - name: Confirm the origin still serves this build
        run: |
          bundle=$(curl -sf "$TINCT_ORIGIN/reader" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          if [ "$bundle" != "$BUNDLE" ]; then
            echo "::error::$TINCT_ORIGIN serves ${bundle:-nothing}, not this run's $BUNDLE (rolled back?). Re-run all jobs to deploy and check again."
            exit 1
          fi

      # -- audio-smoke
      - name: Smoke test
        if: ${{ matrix.group == 'audio-smoke' }}
        env:
          TINCT_EXPECTED_BUNDLE: ${{ needs.deploy.outputs.bundle }}
        run: bash scripts/smoke-test.sh "$TINCT_ORIGIN"
      - name: Verify published Android book downloads
        if: ${{ !cancelled() && matrix.group == 'audio-smoke' }}
        run: node scripts/android/check-publication.mjs "$TINCT_ORIGIN"
      - name: Verify inline audio loading silently
        if: ${{ !cancelled() && matrix.group == 'audio-smoke' }}
        env:
          READER_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ needs.deploy.outputs.bundle }}
        run: node scripts/check-inline-audio-loading.mjs

      # -- publication
      - name: Verify Omarchy commands and themes
        if: ${{ matrix.group == 'publication' }}
        env:
          TINCT_DESKTOP_LIVE: '1'
          TINCT_DESKTOP_VISUAL: '1'
          TINCT_EXPECTED_BUNDLE: ${{ needs.deploy.outputs.bundle }}
        run: node scripts/check-omarchy.mjs
      - name: Verify Lighthouse publication
        if: ${{ !cancelled() && matrix.group == 'publication' }}
        env:
          TEST_BOOK: to-the-lighthouse
          READER_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ needs.deploy.outputs.bundle }}
          ARTIFACT_DIR: artifacts/lighthouse-publication-live
        run: |
          node scripts/check-book-publication.cjs
          node scripts/check-lighthouse-characters.cjs
      # Symposium is held out of the library (2026-10-02 rights holds), so its
      # publication check is replaced by the held-books check: every whole-book
      # hold is absent from the hub, sitemap and shelves, and every held edition
      # keeps its exact asset and recovery link. Restore the Symposium step when
      # the book returns.
      - name: Verify held books stay out of discovery
        if: ${{ !cancelled() && matrix.group == 'publication' }}
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: node scripts/check-edition-holds-production.cjs

      # -- reader-panels
      - name: Verify reader panels and selection
        if: ${{ matrix.group == 'reader-panels' }}
        env:
          READER_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ needs.deploy.outputs.bundle }}
        run: node scripts/check-reader-panels.mjs
      - name: Verify reader feedback fixes
        if: ${{ !cancelled() && matrix.group == 'reader-panels' }}
        env:
          READER_LIVE: '1'
        run: node scripts/check-reader-feedback.mjs
      - name: Verify spoken Bible book transition silently
        if: ${{ !cancelled() && matrix.group == 'reader-panels' }}
        env:
          READER_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ needs.deploy.outputs.bundle }}
        run: node scripts/check-book-transition.mjs

      # -- page-layout
      - name: Verify Shakespeare layout
        if: ${{ matrix.group == 'page-layout' }}
        env:
          SHAKESPEARE_LIVE: '1'
        run: node scripts/check-shakespeare-layout.mjs
      - name: Verify hyphenation hardening
        if: ${{ !cancelled() && matrix.group == 'page-layout' }}
        env:
          HYPHENATION_LIVE: '1'
          TINCT_EXPECTED_BUNDLE: ${{ needs.deploy.outputs.bundle }}
        run: node scripts/check-hyphenation-hardening.mjs

      # -- production and library: what only production can prove (direct mode only here; staged: production-checks)
      - name: Smoke test production
        if: ${{ matrix.group == 'production' }}
        env:
          TINCT_EXPECTED_BUNDLE: ${{ needs.deploy.outputs.bundle }}
        run: bash scripts/smoke-test.sh https://tinct.app
      - name: Verify production brand metadata and assets
        if: ${{ !cancelled() && matrix.group == 'production' }}
        run: node scripts/check-brand.mjs
      - name: Verify production sign-in completion without real accounts
        if: ${{ !cancelled() && matrix.group == 'production' }}
        run: AUTH_LIVE=1 node scripts/check-sign-in.mjs
      - name: Verify real Grok microphone recovery silently
        if: ${{ !cancelled() && matrix.group == 'production' && contains(github.event.head_commit.message, '[reader-voice-qa]') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -s 175 -w /tmp/tinct-voice-source.wav "Why does the Underground Man call himself sick? What is behind that?"
          python3 scripts/make-voice-qa-wav.py /tmp/tinct-voice-source.wav /tmp/tinct-voice-qa.wav
          READER_LIVE=1 node scripts/grok-capture-acceptance.mjs /tmp/tinct-voice-qa.wav
      - name: Verify production featured-book preview
        if: ${{ matrix.group == 'library' }}
        run: LIBRARY_LIVE=1 node scripts/check-featured-preview.mjs
      - name: Verify public cinematic library
        if: ${{ !cancelled() && matrix.group == 'library' }}
        run: LIBRARY_LIVE=1 node scripts/check-library-public.mjs

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: acceptance-${{ matrix.group }}
          path: |
            app/artifacts
            !app/artifacts/margin

  # ---- Stage 3 (staged mode): promote, then verify what only production can prove ----
  promote:
    needs: [deploy, checks]
    if: ${{ needs.deploy.outputs.staged == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
          browsers: ''
      - name: Promote the version to 100% of production traffic
        run: npm run release:promote -- "${{ needs.deploy.outputs.version_id }}"
      - name: Confirm production serves the new bundle
        env:
          EXPECTED: ${{ needs.deploy.outputs.bundle }}
        run: |
          for attempt in $(seq 1 30); do
            bundle=$(curl -sf https://tinct.app/reader \
              | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ "$bundle" = "$EXPECTED" ]; then
              echo "production serves $bundle after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo '::error::production did not start serving the promoted bundle within 150s'
          exit 1

  production-checks:
    needs: [deploy, promote]
    if: ${{ needs.deploy.outputs.staged == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [library, production]
    name: production-checks (${{ matrix.group }})
    env:
      CI: true
      TINCT_ORIGIN: https://tinct.app
      TEST_ORIGIN: https://tinct.app
      BUNDLE: ${{ needs.deploy.outputs.bundle }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
          browsers: chromium webkit
      - uses: actions/download-artifact@v4
        with:
          name: deployed-dist
          path: ${{ runner.temp }}
      - name: Unpack the deployed build
        run: tar -I zstd -xf "$RUNNER_TEMP/deployed-dist.tar.zst"
      - name: Confirm production still serves this build
        run: |
          bundle=$(curl -sf "$TINCT_ORIGIN/reader" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          if [ "$bundle" != "$BUNDLE" ]; then
            echo "::error::$TINCT_ORIGIN serves ${bundle:-nothing}, not this run's $BUNDLE (rolled back?). Re-run all jobs to deploy and check again."
            exit 1
          fi
      - name: Smoke test production
        if: ${{ matrix.group == 'production' }}
        env:
          TINCT_EXPECTED_BUNDLE: ${{ needs.deploy.outputs.bundle }}
        run: bash scripts/smoke-test.sh https://tinct.app
      - name: Verify production brand metadata and assets
        if: ${{ !cancelled() && matrix.group == 'production' }}
        run: node scripts/check-brand.mjs
      - name: Verify production sign-in completion without real accounts
        if: ${{ !cancelled() && matrix.group == 'production' }}
        run: AUTH_LIVE=1 node scripts/check-sign-in.mjs
      - name: Verify real Grok microphone recovery silently
        if: ${{ !cancelled() && matrix.group == 'production' && contains(github.event.head_commit.message, '[reader-voice-qa]') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -s 175 -w /tmp/tinct-voice-source.wav "Why does the Underground Man call himself sick? What is behind that?"
          python3 scripts/make-voice-qa-wav.py /tmp/tinct-voice-source.wav /tmp/tinct-voice-qa.wav
          READER_LIVE=1 node scripts/grok-capture-acceptance.mjs /tmp/tinct-voice-qa.wav
      - name: Verify production featured-book preview
        if: ${{ matrix.group == 'library' }}
        run: LIBRARY_LIVE=1 node scripts/check-featured-preview.mjs
      - name: Verify public cinematic library
        if: ${{ !cancelled() && matrix.group == 'library' }}
        run: LIBRARY_LIVE=1 node scripts/check-library-public.mjs
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: production-acceptance-${{ matrix.group }}
          path: app/artifacts

  # ---- Automatic rollback ----------------------------------------------
  # Reached when the new build went live (direct deploy, or a promotion) and a later job did not pass (a failed
  # check, a check cut off by its time limit, or the deploy job failing after its deploy step). The run still
  # ends red; this just stops users staying on a bad version.
  rollback:
    needs: [deploy, checks, promote, production-checks]
    if: ${{ always() && (needs.deploy.outputs.live == 'true' || needs.promote.result == 'success') && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
          browsers: ''
      - name: Roll production back to the previous version
        env:
          PREVIOUS_VERSION: ${{ needs.deploy.outputs.previous_version }}
        run: |
          echo "::error::a check failed after the new version went live; rolling back to ${PREVIOUS_VERSION:-the previous deployment}"
          npm run rollback -- "$PREVIOUS_VERSION"
          echo "Rolled back to ${PREVIOUS_VERSION:-the previous deployment}. Fix forward, then push again." >> "$GITHUB_STEP_SUMMARY"
