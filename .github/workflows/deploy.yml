name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-tinct-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CI: true
      - run: npm run verify-bundle

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler returns before Cloudflare finishes serving the new assets, so
      # the smoke test used to read the new bundle hash out of the HTML and get
      # the SPA fallback instead of JavaScript. That failed the run on a race,
      # not a regression. Wait for the referenced bundle to actually be served.
      - name: Wait for the new bundle to be served
        run: |
          for attempt in $(seq 1 30); do
            bundle=$(curl -sf https://tinct.app/reader \
              | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ -n "$bundle" ] && curl -sf "https://tinct.app$bundle" \
                 | head -c 200 | grep -qE 'var |function |const |import |Object\.'; then
              echo "serving $bundle after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo '::warning::new bundle was still not served after 150s; smoke test may report a stale asset'

      - name: Smoke test production
        run: bash scripts/smoke-test.sh https://tinct.app
