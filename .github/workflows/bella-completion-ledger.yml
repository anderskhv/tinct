name: bella-completion-ledger
on:
  push:
    branches: ['codex/bella-completion-ledger-20260921']
    paths: ['tools/audio-highlight/bella_completion_ledger.py', '.github/workflows/bella-completion-ledger.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile prior attempts and read provider state without launching
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python3 tools/audio-highlight/bella_completion_ledger.py
      - name: Save evidence
        if: always()
        run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          git add artifacts/bella-completion-ledger-2026-09-21
          git diff --cached --quiet && exit 0
          git commit -m "Record remaining Bella work and provider preflight [skip ci]"
          git push origin HEAD:codex/bella-completion-ledger-20260921
