name: E-ink browser appearance
on:
  pull_request:
    paths:
      - 'app/public/lab/display-profile*'
      - 'app/src/utils/displayProfile.test.ts'
      - 'app/scripts/check-eink-browser.mjs'
      - '.github/workflows/eink-browser.yml'
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - if: github.event_name != 'workflow_run'
        run: CI=true npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-eink-browser.mjs
        env:
          EINK_LIVE: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
      - name: Check the current production appearance before releasing a changed check
        if: github.event_name == 'pull_request'
        run: node scripts/check-eink-browser.mjs
        env:
          EINK_LIVE: '1'
          EINK_OUTPUT: artifacts/eink-browser/current-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eink-browser
          path: app/artifacts/eink-browser
