name: Approved shared reader continuation (23 October only)
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: shared-reader-approved-once-20261023
  cancel-in-progress: false
jobs:
  approved-release:
    if: >-
      github.repository == 'anderskhv/tinct' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'anderskhv/tinct' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write
    steps:
      - name: Continue only the reviewed correction merge before the original cutoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const run = event.workflow_run
          const repo = 'anderskhv/tinct'
          if (run.event !== 'push' || run.head_branch !== 'main' ||
              run.head_repository.full_name !== repo || run.conclusion !== 'success') throw Error('Untrusted trigger')
          // Native fetch has no automatic request retries. The token stays on
          // GitHub API requests; the production GET receives only the check header.
          const api = async (method, path, body) => {
            const response = await fetch('https://api.github.com' + path, {
              method, headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'User-Agent': 'tinct-approved-release-20261023',
                Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                ...(body ? { 'Content-Type': 'application/json' } : {}) },
              ...(body ? { body: JSON.stringify(body) } : {}),
            })
            if (!response.ok) throw Error(`GitHub ${method} ${path}: HTTP ${response.status}`)
            if (response.status === 204) return undefined
            return response.headers.get('content-type')?.includes('json') ? response.json() : response.arrayBuffer()
          }
          const [main, pr] = await Promise.all([
            api('GET', `/repos/${repo}/git/ref/heads/main`),
            api('GET', `/repos/${repo}/pulls/607`),
          ])
          if (!pr.merged || pr.merge_commit_sha !== run.head_sha || main.object.sha !== run.head_sha ||
              pr.base.ref !== 'main' || pr.head.repo.full_name !== repo ||
              pr.head.ref !== 'codex/shared-reader-acceptance-corrections-20261023') {
            console.log('Inert: this is not the one reviewed correction merge')
            process.exit(0)
          }
          // No checkout or PR artifacts. Execute only this reviewed, blob-pinned
          // module fetched at the exact successful main source.
          const file = await api('GET', `/repos/${repo}/contents/scripts/shared-reader-approved-once.mjs?ref=${run.head_sha}`)
          if (file.sha !== 'f7ba4d8016e63e069f43cfb8783eea50a3485ae5' || file.encoding !== 'base64') throw Error('Helper blob changed')
          const { releaseApprovedOnce } = await import('data:text/javascript;base64,' + file.content.replace(/\s/g, ''))
          const result = await releaseApprovedOnce({ api,
            fetchLive: async url => {
              const response = await fetch(url, { headers: { 'x-tinct-check': '1', 'Cache-Control': 'no-cache' }, cache: 'no-store' })
              return { status: response.status, text: await response.text() }
            }, log: message => console.log(message),
          }, { verifyRunId: run.id, headSha: run.head_sha })
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Approved one-time release result\n\n```json\n' + JSON.stringify(result, null, 2) + '\n```\n')
          NODE
