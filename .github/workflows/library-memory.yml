name: Library memory budget
# The library's pixels and heap on an iPhone and an iPad, signed out and signed in
# (app/scripts/check-library-memory.mjs). iOS killed the tab opening a book (2026-10-21).
on:
  pull_request:
    paths: ['app/public/lab/library_2/**', 'app/public/lab/book-cover.js', 'app/scripts/check-library-memory.mjs', '.github/workflows/library-memory.yml']
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: CI=true npm run build
      - run: npx playwright install --with-deps chromium
      - run: LIBRARY_MEMORY_ARTIFACTS=artifacts/library-memory node scripts/check-library-memory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-memory
          path: app/artifacts/library-memory
