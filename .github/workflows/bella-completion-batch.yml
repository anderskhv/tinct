name: bella-completion-batch-recovery
on:
  push:
    branches: ['codex/bella-completion-batch-20260921']
    paths: ['.github/workflows/bella-completion-batch.yml']
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bella-completion-batch
          run-id: 35594476955
          github-token: ${{ github.token }}
          path: artifacts/bella-completion-batch-2026-09-21
      - name: Show recorded cause without starting another pod
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path("artifacts/bella-completion-batch-2026-09-21").rglob("pod.json"):
              j=json.loads(p.read_text())
              print(json.dumps(j,indent=1))
          PY
      - name: Preserve recovered evidence
        run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=[str(p) for p in Path("artifacts/bella-completion-batch-2026-09-21").rglob("*") if p.is_file() and p.suffix in (".json",".log",".txt")]
          subprocess.run(["git","add","--",*files],check=True)
          PY
          git diff --cached --quiet && exit 0
          git commit -m "Preserve failed-host diagnostics before retry [skip ci]"
          git push origin HEAD:codex/bella-completion-batch-20260921
