name: bella-completion-batch-acoustic
on:
  push:
    branches: ['codex/bella-completion-batch-20260921']
    paths: ['tools/audio-highlight/bella_batch_acoustic.py', '.github/workflows/bella-completion-batch.yml']
permissions:
  contents: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bella-completion-batch
          run-id: 35595402721
          github-token: ${{ github.token }}
          path: artifacts/bella-completion-batch-2026-09-21
      - name: Install independent acoustic checker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install openai-whisper av==18.1.0
      - name: Verify unchanged recordings and acoustic agreement
        timeout-minutes: 50
        run: python3 tools/audio-highlight/bella_batch_acoustic.py
      - name: Preserve all candidates and checks
        if: always()
        run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=[str(p) for p in Path("artifacts/bella-completion-batch-2026-09-21").rglob("*") if p.is_file() and p.suffix in (".json",".log",".txt")]
          subprocess.run(["git","add","-f","--",*files],check=True)
          PY
          git diff --cached --quiet && exit 0
          git commit -m "Preserve GPU alignment and independent acoustic results [skip ci]"
          git push origin HEAD:codex/bella-completion-batch-20260921
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bella-completion-batch-reviewed
          path: artifacts/bella-completion-batch-2026-09-21
          retention-days: 30
