name: voice-lab-acceptance
on:
  workflow_dispatch:
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read

concurrency:
  group: voice-lab-acceptance
  cancel-in-progress: false

jobs:
  voice:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources; npx playwright install --with-deps chromium
      - name: Prepare deterministic muted microphone source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -s 175 -w /tmp/tinct-voice-source.wav "Why does the Underground Man call himself sick? What is behind that?"
          python3 scripts/make-voice-qa-wav.py /tmp/tinct-voice-source.wav /tmp/tinct-voice-qa.wav
      - name: Verify current production voices and delayed lookup acknowledgement
        run: |
          # One short guest-trial call checks both voices (scripts/grok-voice-handshake-acceptance.mjs).
          VERIFY_FORCE_MESSAGE=1 node scripts/grok-voice-handshake-acceptance.mjs /tmp/tinct-voice-qa.wav
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: voice-room-acceptance
          path: app/artifacts/voice-capture
