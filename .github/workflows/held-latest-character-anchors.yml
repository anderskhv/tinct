name: Verify latest repair character anchors
on:
  push:
    branches: [codex/held-release-qa-20260926]
    paths: ['app/scripts/check-latest-repair-character-anchors.py', '.github/workflows/held-latest-character-anchors.yml']
permissions:
  contents: read
  actions: read
jobs:
  anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: held-latest-reconciliation
          run-id: 36254505233
          github-token: ${{ github.token }}
          path: app/artifacts/held-latest-reconciliation
      - run: python3 app/scripts/check-latest-repair-character-anchors.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: held-latest-character-anchors
          path: |
            app/artifacts/held-latest-reconciliation/character-anchor-report.json
            app/artifacts/held-latest-reconciliation/*.characters.json
