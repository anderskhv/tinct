name: bella-focused-acoustic
on:
  push:
    branches: ['codex/bella-focused-acoustic-20260921']
    paths: ['tools/audio-highlight/bella_focused_acoustic.py', '.github/workflows/bella-focused-acoustic.yml']
permissions:
  contents: write
jobs:
  review:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        target: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned recognition libraries
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install openai-whisper==20250625 faster-whisper==1.2.1 ctranslate2==4.8.2 av==18.1.0
      - name: Recover or repair only this authorized chapter
        timeout-minutes: 45
        run: python3 tools/audio-highlight/bella_focused_acoustic.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-${{ matrix.target }}
          path: artifacts/bella-focused-acoustic-2026-09-21
          retention-days: 30
  preserve:
    if: always()
    needs: review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: focused-*
          merge-multiple: true
          path: artifacts/bella-focused-acoustic-2026-09-21
      - run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          git add -f artifacts/bella-focused-acoustic-2026-09-21
          git diff --cached --quiet && exit 0
          git commit -m "Preserve narrow chapter repair evidence [skip ci]"
          git push origin HEAD:codex/bella-focused-acoustic-20260921
