name: audio-align-canary

on:
  workflow_dispatch:
  # One-shot API fallback: creating this exact branch starts the reviewed canary
  # when no authenticated workflow-dispatch client is available.
  push:
    branches:
      - 'codex/audio-canary-run-20260916'

permissions:
  contents: read

concurrency:
  group: audio-align-canary
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      TINCT_GPU_BUDGET: '15'
      ARTIFACT_DIR: artifacts/audio-highlight-cloud-resume-2026-09-16/run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable runner and live active batch
        run: |
          git fetch --no-tags origin codex/audio-runner-reviewed
          mkdir -p "$ARTIFACT_DIR"
          python3 tools/audio-highlight/gpu/verify_active_batch.py \
            --batch artifacts/audio-highlight-cloud-resume-2026-09-16/active-batch.json \
            --ledger artifacts/audio-highlight-cloud-resume-2026-09-16/runpod-spend-ledger.json \
            --reviewed-commit "$(git rev-parse FETCH_HEAD)" \
            --evidence "$ARTIFACT_DIR/active-batch-preflight.json" \
            --github-env "$GITHUB_ENV"

      - name: Verify launch and batch invariants
        run: |
          python3 tools/audio-highlight/gpu/test_preflight_launch.py
          (cd tools/audio-highlight/gpu && python3 test_active_batch.py)
          (cd tools/audio-highlight/aligner && python3 test_normalisation_v3.py)


      - name: Fail closed unless the remote guard can enforce the envelope
        run: |
          test -n "${RUNPOD_API_KEY}" || {
            echo '::error::RUNPOD_API_KEY is not configured'
            exit 2
          }
          mkdir -p "$ARTIFACT_DIR"
          python3 tools/audio-highlight/runpod_guard.py status \
            --budget "$TINCT_GPU_BUDGET" \
            --spent "$TINCT_GPU_SPENT" \
            --max-rate 1.00 \
            --max-minutes 50 \
            --json-out "$ARTIFACT_DIR/preflight-guard.json"
          python3 tools/audio-highlight/gpu/preflight_launch.py \
            "$ARTIFACT_DIR/preflight-guard.json" \
            --budget "$TINCT_GPU_BUDGET"

      - name: Align the frozen verified-ready batch
        run: |
          set +e
          python3 tools/audio-highlight/gpu/orchestrate.py run \
            --name "tinct-words-cloud-resume-${GITHUB_RUN_ID}-1" \
            --batch artifacts/audio-highlight-cloud-resume-2026-09-16/active-batch.json \
            --commit "${GITHUB_SHA}" \
            --artifacts "$ARTIFACT_DIR" \
            --cloud COMMUNITY \
            --helper v4 \
            --arms "off auto" \
            --max-seconds 1800 \
            --deadline-minutes 35
          first_status=$?
          set -e
          if [ "$first_status" -eq 0 ]; then
            exit 0
          fi
          retry_spent="$(python3 tools/audio-highlight/gpu/host_retry_gate.py \
            "$ARTIFACT_DIR/pods/tinct-words-cloud-resume-${GITHUB_RUN_ID}-1/pod.json" \
            --base-spend "$TINCT_GPU_SPENT")"
          python3 tools/audio-highlight/runpod_guard.py status \
            --budget "$TINCT_GPU_BUDGET" \
            --spent "$retry_spent" \
            --max-rate 1.00 \
            --max-minutes 50 \
            --json-out "$ARTIFACT_DIR/retry-guard.json"
          python3 tools/audio-highlight/gpu/preflight_launch.py \
            "$ARTIFACT_DIR/retry-guard.json" \
            --budget "$TINCT_GPU_BUDGET"
          python3 tools/audio-highlight/gpu/orchestrate.py run \
            --name "tinct-words-cloud-resume-${GITHUB_RUN_ID}-2" \
            --batch artifacts/audio-highlight-cloud-resume-2026-09-16/active-batch.json \
            --commit "${GITHUB_SHA}" \
            --artifacts "$ARTIFACT_DIR" \
            --cloud COMMUNITY \
            --helper v4 \
            --arms "off auto" \
            --max-seconds 1800 \
            --deadline-minutes 35

      - name: Record provider billing when available
        if: always()
        run: |
          python3 tools/audio-highlight/gpu/billing_check.py "$ARTIFACT_DIR" \
            > "$ARTIFACT_DIR/billing.txt" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-align-canary-${{ github.run_id }}
          path: artifacts/audio-highlight-cloud-resume-2026-09-16/run
          retention-days: 14
