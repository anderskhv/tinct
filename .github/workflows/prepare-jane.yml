name: Prepare accepted Jane edition
on:
  push:
    branches: ['codex/jane-reviewed-release-20260924']
    paths: ['books/wip/jane-release-20260924.json', '.github/workflows/prepare-jane.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned content
        run: |
          python3 app/scripts/prepare-reviewed-editions.py --config books/wip/jane-release-20260924.json
          python3 books/classify-modern-en.py jane-eyre --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jane-preparation
          path: books/wip/jane-release-20260924-report.json
      - name: Commit prepared content only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/data/editions/jane-eyre-modern-en.json app/public/data/characters/jane-eyre.v1.json app/src/services/characters/characterCards.ts books/wip/jane-release-20260924-report.json
          git commit -m 'content: prepare accepted Jane Eyre text and compatible character anchors'
          git push
