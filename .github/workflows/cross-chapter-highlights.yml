name: Cross-chapter highlighting
on:
  pull_request:
    paths:
      - 'app/src/lab/labChapterSelection*'
      - 'app/scripts/check-cross-chapter-highlights.mjs'
      - '.github/workflows/cross-chapter-highlights.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: npm run build
        env:
          CI: true
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-cross-chapter-highlights.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-chapter-highlights
          path: app/artifacts/cross-chapter
