name: audio-canary-evidence

on:
  push:
    branches:
      - 'codex/audio-canary-evidence-20260917'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen canary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35159131556 --repo anderskhv/tinct --name audio-align-canary-35159131556 --dir /tmp/canary
      - name: Verify and expose result
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/canary')
          pod_files=list(root.rglob('pod.json'))
          chapters=list(root.rglob('chapter.json'))
          candidates=list(root.rglob('words.candidate.json'))
          if len(pod_files)!=1:
              raise SystemExit(f'expected one pod.json, found {len(pod_files)}')
          pod=json.loads(pod_files[0].read_text())
          chapter_rows=[]
          for path in chapters:
              data=json.loads(path.read_text())
              chapter_rows.append({
                  'arm':path.parent.name,
                  'status':data.get('status'),
                  'reasons':data.get('reasons'),
                  'validation_errors':data.get('validation_errors'),
              })
          candidate_rows=[{
              'arm':p.parent.name,
              'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
              'bytes':p.stat().st_size,
          } for p in candidates]
          billing=' | '.join(p.read_text(errors='replace').strip().replace('\n',' | ')[:1200] for p in root.rglob('billing.txt'))
          summary={
              'run':35159131556,
              'pod':{k:pod.get(k) for k in ('podId','cloud','gpu','costPerHr','uptimeMinutes','estimatedCost','jobOutcome','resultsFetched','statusAfterStop','terminateHttp','helperPayloadPreflight')},
              'chapters':chapter_rows,
              'candidates':candidate_rows,
              'billing':billing,
          }
          print('::notice title=Audio canary evidence::'+json.dumps(summary,separators=(',',':')))
          if not chapter_rows or any(row['status']!='candidate_requires_acoustic_review' or row['reasons'] or row['validation_errors'] for row in chapter_rows):
              raise SystemExit('canary did not produce clean review candidates in every arm')
          if pod.get('statusAfterStop')=='RUNNING' or pod.get('terminateHttp') not in (200,204):
              raise SystemExit('pod teardown evidence is not clean')
          Path('canary-evidence.json').write_text(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audio-canary-evidence-35159131556
          path: canary-evidence.json
          retention-days: 14
