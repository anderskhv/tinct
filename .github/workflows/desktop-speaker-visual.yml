name: Desktop speaker visual acceptance
on:
  push:
    branches: ['codex/desktop-speakers-preview-check']
permissions:
  contents: read
jobs:
  desktop-speakers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: true
      - run: npm run verify-bundle
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-shakespeare-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-speakers-preview
          path: app/artifacts/shakespeare-layout
