name: Desktop speaker production acceptance
on:
  push:
    branches: ['codex/desktop-speakers-preview-check']
permissions:
  contents: read
jobs:
  desktop-speakers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Wait for corrected production bundle
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf https://tinct.app/reader | grep -q '/assets/index-CAc7hXSW.js'; then exit 0; fi
            sleep 5
          done
          exit 1
      - run: SHAKESPEARE_LIVE=1 node scripts/check-shakespeare-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-speakers-production
          path: app/artifacts/shakespeare-layout
