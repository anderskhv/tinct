name: Shakespeare speaker acceptance
on:
  pull_request:
    paths:
      - 'app/src/lab/**'
      - 'app/scripts/check-shakespeare-speakers.mjs'
      - '.github/workflows/shakespeare-speakers.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/lab/**'
      - 'app/scripts/check-shakespeare-speakers.mjs'
      - '.github/workflows/shakespeare-speakers.yml'
permissions:
  contents: read
  actions: read
jobs:
  all-shakespeare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: npm run build
      - run: npm run verify-bundle
      - run: npx playwright install --with-deps chromium webkit
      - name: Wait for the matching release smoke check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
          async function get(path) {
            const response = await fetch(base + path, { headers })
            if (!response.ok) throw Error(`GitHub release check: HTTP ${response.status}`)
            return response.json()
          }
          for (let attempt = 0; attempt < 60; attempt++) {
            const data = await get(`/actions/runs?head_sha=${process.env.GITHUB_SHA}&event=push&per_page=30`)
            const release = data.workflow_runs.find(run => run.path === '.github/workflows/deploy.yml')
            if (release) {
              const { jobs } = await get(`/actions/runs/${release.id}/jobs`)
              if (jobs.some(job => job.steps.some(step => step.name === 'Smoke test production' && step.conclusion === 'success'))) {
                console.log(`Matching release ${release.id} verified its exact deployed bundle and passed smoke`)
                process.exit(0)
              }
            }
            await new Promise(resolve => setTimeout(resolve, 10000))
          }
          throw Error('Matching release has not passed its production smoke check')
          JS
      - name: Verify all Shakespeare editions and the reported passage
        env:
          SHAKESPEARE_LIVE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node scripts/check-shakespeare-speakers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shakespeare-speakers
          path: app/artifacts/shakespeare-speakers
