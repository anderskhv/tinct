name: Shakespeare speaker acceptance
on:
  pull_request:
    paths:
      - 'app/src/lab/**'
      - 'app/scripts/check-shakespeare-speakers.mjs'
      - '.github/workflows/shakespeare-speakers.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/lab/**'
      - 'app/scripts/check-shakespeare-speakers.mjs'
      - '.github/workflows/shakespeare-speakers.yml'
permissions:
  contents: read
jobs:
  all-shakespeare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: npm run build
      - run: npm run verify-bundle
      - run: npx playwright install --with-deps chromium webkit
      - name: Wait for this production build
        if: github.event_name == 'push'
        run: |
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/app.html | head -1)
          test -n "$expected"
          for attempt in $(seq 1 120); do
            actual=$(curl -sf https://tinct.app/reader | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ "$actual" = "$expected" ]; then
              echo "Verified production bundle $expected"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify all Shakespeare editions and the reported passage
        env:
          SHAKESPEARE_LIVE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node scripts/check-shakespeare-speakers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shakespeare-speakers
          path: app/artifacts/shakespeare-speakers
