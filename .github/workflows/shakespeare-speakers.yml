name: Shakespeare speaker acceptance
on:
  pull_request:
    paths:
      - 'app/src/lab/**'
      - 'app/scripts/check-shakespeare-speakers.mjs'
      - 'app/scripts/check-reader-panels.mjs'
      - 'app/scripts/check-reader-spread.cjs'
      - 'app/scripts/wait-for-release-smoke.mjs'
      - '.github/workflows/shakespeare-speakers.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/lab/**'
      - 'app/scripts/check-shakespeare-speakers.mjs'
      - 'app/scripts/check-reader-panels.mjs'
      - 'app/scripts/check-reader-spread.cjs'
      - 'app/scripts/wait-for-release-smoke.mjs'
      - '.github/workflows/shakespeare-speakers.yml'
permissions:
  contents: read
  actions: read
jobs:
  all-shakespeare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: npm run build
      - run: npm run verify-bundle
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources; npx playwright install --with-deps chromium webkit
      - name: Wait for the matching release smoke check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-release-smoke.mjs
      - name: Verify all Shakespeare editions and the reported passage
        env:
          SHAKESPEARE_LIVE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node scripts/check-shakespeare-speakers.mjs
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: shakespeare-speakers
          path: app/artifacts/shakespeare-speakers
