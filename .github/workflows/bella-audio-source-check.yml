name: bella-audio-source-check
on:
  push:
    branches: ['codex/bella-audio-source-check-20260921']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install openai-whisper==20250625
      - run: python3 tools/audio-highlight/bella_audio_source_check.py
      - if: always()
        run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          git add -f artifacts/bella-audio-source-check-2026-09-21
          git diff --cached --quiet && exit 0
          git commit -m "Record acoustic evidence for changed translations and zero-span suspects [skip ci]"
          git push origin HEAD:codex/bella-audio-source-check-20260921
