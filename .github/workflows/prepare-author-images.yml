name: Prepare reviewed author images
on:
  push:
    branches: [codex/reviewed-author-assets]
    paths:
      - '.github/workflows/prepare-author-images.yml'
      - 'app/scripts/prepare-author-images.py'
      - 'app/public/lab/library_2/author-images.json'
permissions:
  contents: write
concurrency:
  group: reviewed-author-images
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reviewed-author-assets
      - run: python3 app/scripts/prepare-author-images.py
      - name: Commit only verified image bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/lab/library_2/assets/author-flaps
          git diff --cached --quiet || git commit -m "Add verified author and collection image assets"
          git push origin HEAD:codex/reviewed-author-assets
