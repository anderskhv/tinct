name: Grok narration provider acceptance
on:
  push:
    branches: [codex/grok-narration-20260923]
    paths: [.github/workflows/grok-narration-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: grok-narration-provider-20260923
  cancel-in-progress: false
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - name: Four bounded real-provider timestamp checks
        working-directory: app
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: node scripts/check-grok-provider.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-provider-acceptance
          path: app/artifacts/grok-provider/
          retention-days: 14
