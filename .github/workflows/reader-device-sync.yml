name: Reader device sync
on:
  pull_request:
    paths:
      - 'app/src/lab/useLabPositionSync*'
      - 'app/src/lab/labChatHistory*'
      - 'app/src/lab/useLabAsk*'
      - 'app/scripts/check-reader-device-sync.mjs'
      - '.github/workflows/reader-device-sync.yml'
permissions:
  contents: read
jobs:
  devices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: CI=true npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify two independent devices with isolated account services
        run: node scripts/check-reader-device-sync.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-device-sync
          path: app/artifacts/reader-device-sync
