name: bella-focused-evidence-collector
on:
  push:
    branches: ['codex/bella-focused-collected-20260921']
    paths: ['tools/audio-highlight/bella_focused_collect.py', '.github/workflows/bella-focused-collect.yml']
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/audio-highlight/bella_focused_collect.py
