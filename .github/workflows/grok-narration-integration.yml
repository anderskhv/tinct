name: Grok narration integration checks
on:
  push:
    branches: [codex/grok-narration-20260923]
    paths-ignore: [.github/workflows/grok-narration-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: grok-narration-integration-20260923
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: bash ../scripts/cloud-setup.sh
      - run: npm test
      - run: node scripts/check-narration-coordinator.mjs
      - name: Check warm credential availability
        env:
          NARRATION_ADMIN_TOKEN: ${{ secrets.NARRATION_ADMIN_TOKEN }}
        run: node -e "console.log('warm credential available:', Boolean(process.env.NARRATION_ADMIN_TOKEN))"
      - run: npm run build
      - run: npm run verify-bundle
      - run: node scripts/plan-grok-openings.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-reader-fold.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-reader-and-opening-plan
          path: |
            app/artifacts/reader-fold
            app/artifacts/grok-openings
      - name: Validate Worker bindings
        run: npx wrangler deploy --dry-run
