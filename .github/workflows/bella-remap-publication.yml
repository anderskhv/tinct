name: bella-remap-publication-tests
on:
  push:
    branches: ['codex/bella-remap-pilot-20260921']
    paths: ['tools/audio-highlight/bella_remap_publish.py', 'tools/audio-highlight/test_bella_remap_publish.py', '.github/workflows/bella-remap-publication.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/audio-highlight -p test_bella_remap_publish.py -v
