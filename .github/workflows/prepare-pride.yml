name: Prepare accepted Pride edition
on:
  push:
    branches: ['codex/pride-reviewed-release-20260924']
    paths: ['books/wip/pride-release-20260924.json', '.github/workflows/prepare-pride.yml', 'app/scripts/prepare-reviewed-editions.py']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test and prepare pinned content from its exact baseline
        run: |
          python3 app/scripts/test-prepare-reviewed-editions.py
          git show b91d4b8d8ceab2e3379cb6a83174ce97c7c47aec:app/public/data/editions/pride-and-prejudice-modern-en.json > app/public/data/editions/pride-and-prejudice-modern-en.json
          git show b91d4b8d8ceab2e3379cb6a83174ce97c7c47aec:app/public/data/characters/pride-and-prejudice.v1.json > app/public/data/characters/pride-and-prejudice.v1.json
          git show b91d4b8d8ceab2e3379cb6a83174ce97c7c47aec:app/src/services/characters/characterCards.ts > app/src/services/characters/characterCards.ts
          python3 app/scripts/prepare-reviewed-editions.py --config books/wip/pride-release-20260924.json
          python3 books/classify-modern-en.py pride-and-prejudice --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pride-preparation
          path: books/wip/pride-release-20260924-report.json
      - name: Commit prepared content only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/data/editions/pride-and-prejudice-modern-en.json app/public/data/characters/pride-and-prejudice.v1.json app/src/services/characters/characterCards.ts books/wip/pride-release-20260924-report.json
          git diff --cached --quiet || git commit -m 'content: keep character evidence aligned with accepted Pride text'
          git push
