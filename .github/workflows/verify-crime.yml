name: Verify accepted Crime release
on:
  pull_request:
    branches: [main]
    paths: ['app/scripts/prepare-crime-release.py', 'app/src/services/characters/crimeSpoilerBoundaries.test.ts', 'app/public/data/editions/crime-and-punishment-modern-en.json', 'app/public/data/characters/crime-and-punishment.v1.json', '.github/workflows/verify-crime.yml']
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read
jobs:
  accepted-content:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: python3 scripts/prepare-crime-release.py --verify
      - run: npx vitest run src/services/characters/crimeSpoilerBoundaries.test.ts
      - run: python3 ../books/classify-modern-en.py crime-and-punishment --gate
      - run: npm run build
      - run: npm run verify-bundle
      - run: npx playwright install --with-deps chromium webkit
      - name: Check versioned text and character links in the built reader
        env:
          TEST_ORIGIN: https://tinct.app
          READER_BUILT: '1'
          ARTIFACT_DIR: artifacts/crime-release
        run: |
          for book in crime-and-punishment; do
            TEST_BOOK="$book" ARTIFACT_DIR="$ARTIFACT_DIR/$book" node scripts/check-reviewed-characters.cjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crime-release-acceptance
          path: app/artifacts/crime-release
  production-content:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify accepted production text and cards
        env:
          TEST_ORIGIN: https://tinct.app
          ARTIFACT_DIR: artifacts/crime-production
        run: |
          for book in crime-and-punishment; do
            TEST_BOOK="$book" ARTIFACT_DIR="$ARTIFACT_DIR/$book" node scripts/check-reviewed-characters.cjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crime-production-acceptance
          path: app/artifacts/crime-production
