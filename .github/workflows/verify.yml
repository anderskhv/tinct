name: verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'cursor/**'
      - 'codex/audio-v4-pod-plumbing-20260916'

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Set up cloud checkout
        run: bash ../scripts/cloud-setup.sh
      - name: Test audio GPU launch preflight
        run: python3 ../tools/audio-highlight/gpu/test_preflight_launch.py
      - name: Test pinned audio normalisation and cloud plumbing
        run: python3 ../tools/audio-highlight/aligner/test_normalisation_v3.py
      - run: npm test
      - run: npm run build
        env:
          CI: true
      - run: npm run verify-bundle
      - name: Install silent browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify library and preparation
        run: node scripts/check-library-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-preparation-acceptance
          path: app/artifacts/library-layout

  reading-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - name: Test offline reading benchmark
        run: node --test benchmarks/reading-companion/benchmark.test.mjs
      - name: Verify frozen source excerpts
        run: node benchmarks/reading-companion/benchmark.mjs validate benchmarks/reading-companion/cases.json .
      - name: Prepare calibration requests without inference
        run: node benchmarks/reading-companion/benchmark.mjs prepare benchmarks/reading-companion/cases.json benchmarks/reading-companion/candidates.json /tmp/tinct-benchmark-ci calibration
