name: verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'cursor/**'
      - 'codex/audio-v4-pod-plumbing-20260916'

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Set up cloud checkout
        run: bash ../scripts/cloud-setup.sh
      - name: Check project documentation
        run: |
          python3 ../scripts/check-docs.py
          python3 ../scripts/check-docs.py docs/featured-library-preview-2026-09-21.md docs/library-voice-layout-2026-09-17.md docs/library-responsive-2026-09-17.md docs/library-iteration-2026-09-17.md docs/product-current.md docs/reader-panels-selection-2026-09-21.md docs/reader-library-brand-batch-2026-09-21.md
      - name: Test audio GPU launch preflight
        run: python3 ../tools/audio-highlight/gpu/test_preflight_launch.py
      - name: Test pinned audio normalisation and cloud plumbing
        run: python3 ../tools/audio-highlight/aligner/test_normalisation_v3.py
      - run: npm test
      - run: npm run build
        env:
          CI: true
      - run: npm run verify-bundle
        id: bundle_gate
      - name: Reject the competing Workers Builds path
        run: |
          if WORKERS_CI=1 npm run build > /tmp/tinct-workers-build-guard.log 2>&1; then
            echo '::error::Workers Builds unexpectedly produced a competing build'
            exit 1
          fi
          grep -F 'Tinct production builds run through GitHub Actions only' /tmp/tinct-workers-build-guard.log
      - name: Install silent browser acceptance
        run: npx playwright install --with-deps chromium webkit
      - name: Verify real Grok microphone recovery silently
        if: ${{ !cancelled() && steps.bundle_gate.outcome == 'success' && (github.head_ref == 'codex/reader-panels-selection-20260921' || github.head_ref == 'codex/audiobook-grok-voices-20260921' || github.head_ref == 'codex/mobile-reader-library-grok-20260921') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -s 175 -w /tmp/tinct-voice-source.wav "Why does the Underground Man call himself sick? What is behind that?"
          python3 scripts/make-voice-qa-wav.py /tmp/tinct-voice-source.wav /tmp/tinct-voice-qa.wav
          VERIFY_FORCE_MESSAGE=1 VOICE_PERSONA=female node scripts/grok-voice-handshake-acceptance.mjs /tmp/tinct-voice-qa.wav
          VOICE_PERSONA=male node scripts/grok-voice-handshake-acceptance.mjs /tmp/tinct-voice-qa.wav
      - name: Save voice capture acceptance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-capture-acceptance
          path: app/artifacts/voice-capture
      - name: Verify reader panels and selection
        if: ${{ !cancelled() && steps.bundle_gate.outcome == 'success' }}
        run: node scripts/check-reader-panels.mjs
      - name: Save reader acceptance screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-panels-acceptance
          path: app/artifacts/reader-panels
      - name: Verify library and preparation
        if: ${{ !cancelled() && steps.bundle_gate.outcome == 'success' }}
        run: node scripts/check-library-layout.mjs
      - name: Verify Shakespeare layout and library perimeter
        run: node scripts/check-shakespeare-layout.mjs
      - name: Verify currently reading shelf
        if: ${{ !cancelled() }}
        run: node scripts/check-reading-reel.mjs
      - name: Verify hyphenation hardening
        if: ${{ !cancelled() }}
        run: node scripts/check-hyphenation-hardening.mjs
      - name: Verify responsive landing and library
        if: ${{ !cancelled() }}
        run: node scripts/check-entry-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-preparation-acceptance
          path: |
            app/artifacts/shakespeare-layout
            app/artifacts/reading-reel
            app/artifacts/library-layout
            app/artifacts/entry-responsive
            app/artifacts/hyphenation-hardening

  reading-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - name: Test offline reading benchmark
        run: node --test benchmarks/reading-companion/benchmark.test.mjs
      - name: Verify frozen source excerpts
        run: node benchmarks/reading-companion/benchmark.mjs validate benchmarks/reading-companion/cases.json .
      - name: Prepare calibration requests without inference
        run: node benchmarks/reading-companion/benchmark.mjs prepare benchmarks/reading-companion/cases.json benchmarks/reading-companion/candidates.json /tmp/tinct-benchmark-ci calibration

  featured-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: npm run build
        env:
          CI: true
      - run: npm run verify-bundle
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify inline audio loading silently
        run: node scripts/check-inline-audio-loading.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-audio-loading
          path: app/artifacts/inline-audio-loading
      - run: node scripts/check-featured-preview.mjs
      - name: Verify compact reader menu
        run: READER_MENU_ONLY=1 node scripts/check-reader-panels.mjs
      - name: Save menu design screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-design-acceptance
          path: app/artifacts/reader-panels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: featured-preview-acceptance
          path: app/artifacts/featured-preview
