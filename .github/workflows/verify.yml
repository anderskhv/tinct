name: verify

# Pull requests run the suites their files need (scripts/ci-suites.mjs: the reader, shared code, dependencies, the
# workflows, the build and the Worker entry always run everything; so does any file no rule names). A push to main,
# the nightly run and a manual run always run everything. The suites run side by side; `ci-summary` is the one check
# to wait for: it passes only when every suite that ran passed and every skipped suite was one the change did not need.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'cursor/**'
      - 'codex/audio-v4-pod-plumbing-20260916'
  schedule:
    # Nightly, everything, on main (whatever path-scoped PRs skipped during the day).
    - cron: '17 2 * * *'

permissions:
  contents: read

# A newer push to the same pull request supersedes its run; main and the nightly run are never cancelled.
concurrency:
  group: verify-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      signin: ${{ steps.suites.outputs.signin }}
      panels: ${{ steps.suites.outputs.panels }}
      library: ${{ steps.suites.outputs.library }}
      featured: ${{ steps.suites.outputs.featured }}
      audio: ${{ steps.suites.outputs.audio }}
      shakespeare: ${{ steps.suites.outputs.shakespeare }}
      typeset: ${{ steps.suites.outputs.typeset }}
      margin: ${{ steps.suites.outputs.margin }}
    steps:
      # A pull request checks out its merge commit: HEAD^1 is the base, so HEAD^1..HEAD is exactly the PR's files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - name: Choose the suites this change needs
        id: suites
        run: |
          node scripts/ci-suites.mjs | tee -a "$GITHUB_OUTPUT"
          { echo '### Suites'; echo; node scripts/ci-suites.mjs | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

  # Unit tests, the docs check, the build and its gates: every change.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
          browsers: ''
      - name: Check project documentation
        run: |
          python3 ../scripts/check-docs.py
          python3 ../scripts/check-docs.py docs/featured-library-preview-2026-09-21.md docs/library-voice-layout-2026-09-17.md docs/library-responsive-2026-09-17.md docs/library-iteration-2026-09-17.md docs/product-current.md docs/reader-panels-selection-2026-09-21.md docs/reader-library-brand-batch-2026-09-21.md
      - name: Test deployed configuration graph
        # Reads production (https://tinct.app/reader): advisory on a pull request, blocking on main and in deploy.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: TINCT_CONFIG_LIVE=1 node --test scripts/check-deployed-config.test.cjs
      - name: Test audio GPU launch preflight
        run: python3 ../tools/audio-highlight/gpu/test_preflight_launch.py
      - name: Test pinned audio normalisation and cloud plumbing
        run: python3 ../tools/audio-highlight/aligner/test_normalisation_v3.py
      - name: Test the CI suite rules
        run: node --test ../scripts/ci-suites.test.mjs
      - run: npm test
      - run: npm run build
        env:
          CI: true
      - run: npm run verify-bundle
      - name: Reject the competing Workers Builds path
        run: |
          if WORKERS_CI=1 npm run build > /tmp/tinct-workers-build-guard.log 2>&1; then
            echo '::error::Workers Builds unexpectedly produced a competing build'
            exit 1
          fi
          grep -F 'Tinct production builds run through GitHub Actions only' /tmp/tinct-workers-build-guard.log

  reader-panels:
    needs: changes
    if: ${{ needs.changes.outputs.panels == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        id: prepare
      - name: Verify real Grok microphone recovery silently
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (github.head_ref == 'codex/audio-acceptance-diagnostics-20260924' || github.head_ref == 'codex/reader-panels-selection-20260921' || github.head_ref == 'codex/audiobook-grok-voices-20260921' || github.head_ref == 'codex/mobile-reader-library-grok-20260921') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          espeak-ng -s 175 -w /tmp/tinct-voice-source.wav "Why does the Underground Man call himself sick? What is behind that?"
          python3 scripts/make-voice-qa-wav.py /tmp/tinct-voice-source.wav /tmp/tinct-voice-qa.wav
          # One short guest-trial call checks both voices (scripts/grok-voice-handshake-acceptance.mjs).
          VERIFY_FORCE_MESSAGE=1 node scripts/grok-voice-handshake-acceptance.mjs /tmp/tinct-voice-qa.wav
      - name: Save voice capture acceptance
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: voice-capture-acceptance
          path: app/artifacts/voice-capture
      - name: Verify reader panels and selection
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node scripts/check-reader-panels.mjs
      - name: Verify reader feedback fixes
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node scripts/check-reader-feedback.mjs
      - name: Verify spoken Bible book transition silently
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node scripts/check-book-transition.mjs
      - name: Save reader acceptance screenshots
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: reader-panels-acceptance
          path: |
            app/artifacts/reader-panels
            app/artifacts/reader-feedback-20260928
            app/artifacts/book-transition

  library:
    needs: changes
    if: ${{ needs.changes.outputs.signin == 'true' || needs.changes.outputs.library == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        id: prepare
      - name: Verify sign-in completion without real accounts
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && needs.changes.outputs.signin == 'true' }}
        run: node scripts/check-sign-in.mjs
      - name: Verify public cinematic library
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && needs.changes.outputs.library == 'true' }}
        run: node scripts/check-library-public.mjs
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: library-acceptance
          path: |
            app/artifacts/sign-in
            app/artifacts/library-public

  page-layout:
    needs: changes
    if: ${{ needs.changes.outputs.shakespeare == 'true' || needs.changes.outputs.typeset == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        id: prepare
      - name: Verify Shakespeare layout
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && needs.changes.outputs.shakespeare == 'true' }}
        run: node scripts/check-shakespeare-layout.mjs
      - name: Verify hyphenation hardening
        if: ${{ !cancelled() && needs.changes.outputs.typeset == 'true' }}
        run: node scripts/check-hyphenation-hardening.mjs
      - name: Verify page breaks end on a filled line
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && needs.changes.outputs.typeset == 'true' }}
        run: node scripts/check-page-break-lines.mjs
      - name: Verify margin width and scrolling chrome before release
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          TINCT_ORIGIN: ''
          TINCT_REFINEMENT_OUTPUT: artifacts/margin-refinements
        run: |
          node scripts/check-reader-margin-refinements.mjs
          node scripts/check-reader-selection-release.mjs
          node scripts/check-reader-mobile-chat-cards.mjs
      - name: Verify native PDF selection stays on source ink
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node src/lab/sharedReader/pdf/pdfOriginalSelection.browser.mjs
      - name: Verify PDF format conversion preserves the source place
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          TINCT_ORIGIN: ''
          PDF_CONVERSION_PARITY: '1'
          PDF_CONVERSION_OUTPUT: artifacts/pdf-conversion
        run: node scripts/check-shared-reader-pdf-original.mjs
      - name: Verify original PDF interactions before release
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          TINCT_ORIGIN: ''
          PDF_ORIGINAL_DIST: dist
          PDF_ORIGINAL_WEBKIT: '1'
        run: node scripts/check-shared-reader-pdf-original.mjs
      - name: Verify original PDF source and figure follow-ups before release
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          TINCT_ORIGIN: ''
          PDF_ORIGINAL_DIST: dist
          PDF_SOURCE_PARITY: '1'
          TINCT_PARITY_OUTPUT: artifacts/pdf-source-parity
        run: node scripts/check-shared-reader-pdf-original.mjs
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: library-preparation-acceptance
          path: |
            app/artifacts/shakespeare-layout
            app/artifacts/hyphenation-hardening
            app/artifacts/page-break-lines
            app/artifacts/pdf-source-parity
            app/artifacts/mobile-chat-cards

  # The PDF reader's margin (docs/margin/BRIEF.md "Layout QA"): docs/margin/layout-check.mjs must return
  # no problems. app/public is served locally and every AI call and account route is mocked by the script,
  # so nothing leaves the runner. A fast sample here, in four parts side by side (MARGIN_SHARD: every check is
  # in exactly one part); `npm run check:margin:full` runs the whole matrix.
  margin-layout:
    needs: changes
    if: ${{ needs.changes.outputs.margin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: margin-layout (${{ matrix.shard }}/4)
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
          browsers: chromium
      - name: Check the margin's layout, keys and actions (sample of the stress matrix, AI mocked)
        # Failing rows also become annotations, readable from the check run without the log.
        env:
          MARGIN_SHARD: ${{ matrix.shard }}/4
        run: |
          set +e
          npm run check:margin 2>&1 | tee margin-check.log
          status=${PIPESTATUS[0]}
          grep -E '^FAIL|[1-9][0-9]* problem\(s\)|Error' margin-check.log | head -20 | cut -c1-1600 | sed 's/^/::error title=margin-layout::/'
          exit $status
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: margin-layout-${{ matrix.shard }}of4
          path: app/artifacts/margin

  reading-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - name: Test offline reading benchmark
        run: node --test benchmarks/reading-companion/benchmark.test.mjs
      - name: Verify frozen source excerpts
        run: node benchmarks/reading-companion/benchmark.mjs validate benchmarks/reading-companion/cases.json .
      - name: Prepare calibration requests without inference
        run: node benchmarks/reading-companion/benchmark.mjs prepare benchmarks/reading-companion/cases.json benchmarks/reading-companion/candidates.json /tmp/tinct-benchmark-ci calibration

  featured-preview:
    needs: changes
    if: ${{ needs.changes.outputs.audio == 'true' || needs.changes.outputs.featured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        id: prepare
      - name: Verify inline audio loading silently
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && needs.changes.outputs.audio == 'true' }}
        run: node scripts/check-inline-audio-loading.mjs
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: inline-audio-loading
          path: app/artifacts/inline-audio-loading
      - name: Verify the featured-book preview
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && needs.changes.outputs.featured == 'true' }}
        run: node scripts/check-featured-preview.mjs
      - name: Verify compact reader menu
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && needs.changes.outputs.featured == 'true' }}
        run: READER_MENU_ONLY=1 node scripts/check-reader-panels.mjs
      - name: Save menu design screenshots
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: menu-design-acceptance
          path: |
            app/artifacts/reader-panels
            app/artifacts/reader-feedback-20260928
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          retention-days: 3
          name: featured-preview-acceptance
          path: app/artifacts/featured-preview

  # The one check to wait for (and to require, should main ever be protected): green only when the suite choice ran,
  # every suite that ran passed, and every skipped suite was one this change did not need.
  ci-summary:
    if: ${{ always() }}
    needs: [changes, app, reader-panels, library, page-layout, margin-layout, reading-benchmark, featured-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Judge the suites
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node - <<'EOF'
          const needs = JSON.parse(process.env.NEEDS)
          const s = needs.changes.outputs || {}
          const on = (...names) => names.some(n => s[n] === 'true')
          // Which suites a job carries: it may be skipped only when none of them was needed.
          const carries = { 'reader-panels': on('panels'), library: on('signin', 'library'), 'page-layout': on('shakespeare', 'typeset'),
            'margin-layout': on('margin'), 'featured-preview': on('audio', 'featured'), app: true, 'reading-benchmark': true }
          const problems = []
          if (needs.changes.result !== 'success') problems.push(`changes: ${needs.changes.result} (the suites could not be chosen)`)
          for (const [job, { result }] of Object.entries(needs)) {
            if (job === 'changes') continue
            const ok = result === 'success' || (result === 'skipped' && !carries[job])
            console.log(`${ok ? 'ok  ' : 'FAIL'} ${job}: ${result}${result === 'skipped' ? (carries[job] ? ' (needed)' : ' (not needed by this change)') : ''}`)
            if (!ok) problems.push(`${job}: ${result}`)
          }
          if (problems.length) { console.log('::error::' + problems.join('; ')); process.exit(1) }
          EOF
