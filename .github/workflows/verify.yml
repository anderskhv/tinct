name: verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'cursor/**'

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Set up cloud checkout
        run: bash ../scripts/cloud-setup.sh
      - run: npm test
      - run: npm run build
        env:
          CI: true
      - run: npm run verify-bundle
