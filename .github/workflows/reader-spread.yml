name: Reader spread flow
on:
  pull_request:
    branches: [main]
    paths: ['app/src/lab/**', 'app/scripts/check-reader-spread.cjs', '.github/workflows/reader-spread.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: CI=true npm run build && npm run verify-bundle
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-reader-spread.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-spread
          path: app/artifacts/reader-spread
