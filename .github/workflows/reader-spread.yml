name: Reader spread flow
on:
  pull_request:
    branches: [main]
    paths: ['app/src/lab/**', 'app/scripts/check-reader-spread.cjs', 'app/scripts/check-opening-highlights.cjs', '.github/workflows/reader-spread.yml']
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engines: chromium,webkit
          - os: macos-14
            engines: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - if: github.event_name != 'workflow_run'
        run: CI=true npm run build && npm run verify-bundle
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify next-chapter highlight selection and persistence
        run: node scripts/check-opening-highlights.cjs
        env:
          READER_ENGINES: ${{ matrix.engines }}
          READER_BUILT: ${{ github.event_name == 'workflow_run' && '0' || '1' }}
      - run: node scripts/check-reader-spread.cjs
        env:
          READER_ENGINES: ${{ matrix.engines }}
          READER_BUILT: ${{ github.event_name == 'workflow_run' && '0' || '1' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-spread-${{ matrix.os }}
          path: |
            app/artifacts/reader-spread
            app/artifacts/opening-highlights
