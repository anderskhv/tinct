name: Prepare accepted Meditations edition
on:
  push:
    branches: ['codex/meditations-reviewed-release-20260924']
    paths: ['books/wip/meditations-release-20260924.json', '.github/workflows/prepare-meditations.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Test and prepare pinned content
        run: |
          git show b91d4b8d8ceab2e3379cb6a83174ce97c7c47aec:app/public/data/editions/meditations-modern-en.json > app/public/data/editions/meditations-modern-en.json
          git show b91d4b8d8ceab2e3379cb6a83174ce97c7c47aec:app/public/data/characters/meditations.v1.json > app/public/data/characters/meditations.v1.json
          git show b91d4b8d8ceab2e3379cb6a83174ce97c7c47aec:app/src/services/characters/characterCards.ts > app/src/services/characters/characterCards.ts
          python3 app/scripts/test-prepare-reviewed-editions.py
          python3 app/scripts/prepare-reviewed-editions.py --config books/wip/meditations-release-20260924.json
          python3 books/classify-modern-en.py meditations --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meditations-preparation
          path: books/wip/meditations-release-20260924-report.json
      - name: Commit prepared content only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/public/data/editions/meditations-modern-en.json app/public/data/characters/meditations.v1.json app/src/services/characters/characterCards.ts books/wip/meditations-release-20260924-report.json
          git commit -m 'content: prepare accepted Meditations and reviewed terminology links'
          git push
