name: Live navigation diagnosis
on:
  pull_request:
    paths:
      - '.github/workflows/navigation-diagnostic.yml'
      - 'app/scripts/check-sign-in.mjs'
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Read-only diagnostic to run; never deploys'
        type: choice
        options: [sign-in, reader-transport]
        default: sign-in
permissions:
  contents: read
jobs:
  navigation:
    if: inputs.diagnostic != 'reader-transport'
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
          browsers: 'chromium webkit'
      - name: Diagnose held-edition response bodies
        if: matrix.runner == 1
        working-directory: app
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts/sign-in
          node scripts/check-edition-holds-production.cjs > artifacts/sign-in/held-assets.log 2>&1 || {
            cat artifacts/sign-in/held-assets.log
            exit 1
          }
          cat artifacts/sign-in/held-assets.log
      - name: Diagnose live navigation with synthetic sign-in state
        working-directory: app
        env:
          AUTH_LIVE: '1'
        run: |
          mkdir -p artifacts/sign-in
          for attempt in 1; do
            node scripts/check-sign-in.mjs > "artifacts/sign-in/run-$attempt.log" 2>&1 || {
              sed '/REVIEW_CHUNK/d' "artifacts/sign-in/run-$attempt.log"
              exit 1
            }
            sed '/REVIEW_CHUNK/d' "artifacts/sign-in/run-$attempt.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-navigation-diagnosis-${{ matrix.runner }}
          path: app/artifacts/sign-in
          retention-days: 3
  reader-transport:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'reader-transport'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          build: 'false'
          browsers: 'chromium webkit'
      - name: Capture reader startup transport evidence
        working-directory: app
        env:
          SHAKESPEARE_LIVE: '1'
          SHAKESPEARE_NETLOG: '1'
        run: |
          mkdir -p artifacts/shakespeare-layout
          node scripts/check-shakespeare-layout.mjs > artifacts/shakespeare-layout/run.log 2>&1 || {
            sed '/REVIEW_CHUNK/d' artifacts/shakespeare-layout/run.log
            exit 1
          }
          sed '/REVIEW_CHUNK/d' artifacts/shakespeare-layout/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-transport-diagnostic
          path: app/artifacts/shakespeare-layout
          retention-days: 3
