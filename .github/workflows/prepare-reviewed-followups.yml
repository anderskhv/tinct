name: Prepare reviewed followups
on:
  push:
    branches: [codex/reviewed-followups-20260924]
    paths: ['books/wip/reviewed-followups-20260924.json', 'app/scripts/prepare-reviewed-editions.py', '.github/workflows/prepare-reviewed-followups.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reviewed-followups-20260924
          fetch-depth: 20
      - run: python3 app/scripts/test-prepare-reviewed-editions.py
      - run: python3 app/scripts/prepare-reviewed-editions.py --config books/wip/reviewed-followups-20260924.json
      - run: python3 app/scripts/verify-reviewed-release.py --config books/wip/reviewed-followups-20260924.json --baseline b91d4b8d8ceab2e3379cb6a83174ce97c7c47aec
      - name: Commit validated generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/data/editions/the-prince-modern-en.json app/public/data/editions/julius-caesar-modern-en.json app/public/data/editions/jekyll-and-hyde-modern-en.json app/public/data/characters/the-prince.v1.json app/public/data/characters/julius-caesar.v1.json app/public/data/characters/jekyll-and-hyde.v1.json app/src/services/characters/characterCards.ts books/wip/reviewed-followups-20260924-report.json
          git diff --cached --quiet || git commit -m "Publish independently reviewed followup assets on preparation branch"
          git push origin HEAD:codex/reviewed-followups-20260924
