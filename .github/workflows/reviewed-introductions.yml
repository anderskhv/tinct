name: Reviewed introductions and author images
on:
  pull_request:
    paths:
      - 'app/public/lab/library_2/**'
      - 'app/scripts/check-reviewed-introductions.mjs'
      - 'app/src/reviewedIntroductions.test.ts'
      - 'books/wip/remaining-content-20260929/**'
      - '.github/workflows/reviewed-introductions.yml'
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - if: github.event_name != 'workflow_run'
        run: CI=true npm run build
      - if: github.event_name != 'workflow_run'
        run: npm run verify-bundle
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-reviewed-introductions.mjs
        env:
          LIBRARY_LIVE: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-introductions
          path: app/artifacts/reviewed-introductions
