name: Edition availability acceptance
on:
  pull_request:
    paths:
      - 'app/src/data/editionAvailability*'
      - 'app/src/lab/EditionHoldPanel.tsx'
      - 'app/scripts/check-edition-holds.cjs'
      - '.github/workflows/edition-holds.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read
jobs:
  acceptance:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test -- src/data/editionAvailability.test.ts
        working-directory: app
      - run: npm run build && npm run verify-bundle
        working-directory: app
        env:
          CI: true
      - run: npx playwright install --with-deps chromium webkit
        working-directory: app
      - run: node scripts/check-edition-holds.cjs
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edition-hold-acceptance
          path: app/artifacts/edition-holds

  production:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify served catalogue, links and unchanged held assets
        env:
          EXPECTED_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/check-edition-holds-production.cjs
      - name: Verify saved reader recovery against production without account writes
        env:
          TEST_ORIGIN: https://tinct.app
          ARTIFACT_DIR: artifacts/edition-holds-production
        run: node scripts/check-edition-holds.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edition-holds-production
          path: app/artifacts/edition-holds-production
