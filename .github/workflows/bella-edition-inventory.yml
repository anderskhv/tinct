name: bella-edition-inventory
on:
  push:
    branches: ['codex/bella-edition-inventory-20260921']
    paths: ['tools/audio-highlight/bella_edition_inventory.py','.github/workflows/bella-edition-inventory.yml']
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run current file and audio inventory
        run: |
          mkdir -p artifacts/bella-edition-inventory-2026-09-21
          python3 books/wip_inventory.py > artifacts/bella-edition-inventory-2026-09-21/wip.txt
          python3 books/wip_inventory.py --audio > artifacts/bella-edition-inventory-2026-09-21/wip-audio.txt
          python3 tools/audio-highlight/bella_edition_inventory.py
          python3 scripts/check-docs.py
      - name: Preserve read-only inventory evidence
        if: always()
        run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          git add -f artifacts/bella-edition-inventory-2026-09-21
          git diff --cached --quiet && exit 0
          git commit -m "Record current English audio inventory by edition [skip ci]"
          git push origin HEAD:codex/bella-edition-inventory-20260921
