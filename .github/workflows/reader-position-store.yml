name: Reader position durable store
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/worker/readerPositionCoordinator*'
      - 'app/src/worker/routes/labPosition.ts'
      - 'app/src/lab/labPosition.ts'
      - 'app/scripts/check-reader-position-store.mjs'
      - '.github/workflows/reader-position-store.yml'
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: node scripts/check-reader-position-store.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-position-store
          path: app/artifacts/reader-position-store
