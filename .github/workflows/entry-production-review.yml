name: entry-production-review
on:
  push:
    branches: [codex/entry-production-review-20260917]
concurrency:
  group: library-production-visual-review
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the approved release
        run: |
          for attempt in $(seq 1 96); do
            if curl -sf https://tinct.app/lab/entry-responsive.css -o /tmp/live-entry.css && cmp -s public/lab/entry-responsive.css /tmp/live-entry.css; then
              bundle=$(curl -sf https://tinct.app/reader | grep -oE '/assets/index-[A-Za-z0-9_-]+\\.js' | head -1)
              test -n "$bundle"
              echo "TINCT_EXPECTED_BUNDLE=$bundle" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - run: LIBRARY_LIVE=1 node scripts/check-library-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-library-visual-review
          path: app/artifacts/library-layout
