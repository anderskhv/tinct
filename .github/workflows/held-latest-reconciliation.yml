name: Reconcile latest held edition candidates
on:
  push:
    branches: [codex/held-release-qa-20260926]
    paths: ['app/scripts/reconcile-latest-held-candidates.py', 'app/scripts/map-latest-held-candidates.py', '.github/workflows/held-latest-reconciliation.yml']
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 app/scripts/reconcile-latest-held-candidates.py
      - run: python3 app/scripts/map-latest-held-candidates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: held-latest-reconciliation
          path: app/artifacts/held-latest-reconciliation
