name: bella-focused-candidate-reader-check
on:
  push:
    branches: ['codex/bella-focused-candidate-check-20260921']
    paths: ['tools/audio-highlight/bella_focused_candidate_check.py', '.github/workflows/bella-focused-candidate-check.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - run: python3 tools/audio-highlight/bella_focused_candidate_check.py
      - run: |
          cp tools/audio-highlight/bellaReaderData.test.ts app/src/lab/bellaReaderData.test.ts
          cd app
          npm ci
          npm test -- --run src/lab/bellaReaderData.test.ts > ../artifacts/bella-focused-candidate-check-2026-09-21/reader-tests.txt 2>&1
      - if: always()
        run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          git add -f artifacts/bella-focused-candidate-check-2026-09-21
          git diff --cached --quiet && exit 0
          git commit -m "Record candidate and whole-edition reader-data acceptance [skip ci]"
          git push origin HEAD:codex/bella-focused-candidate-check-20260921
