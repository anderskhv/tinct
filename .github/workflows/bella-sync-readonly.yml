name: bella-sync-readonly
on:
  push:
    branches: ['codex/bella-sync-repair-20260921']
    paths: ['tools/audio-highlight/bella_inventory.py', '.github/workflows/bella-sync-readonly.yml']
permissions:
  contents: write
concurrency:
  group: bella-sync-readonly
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate audit syntax
        run: python3 -m py_compile tools/audio-highlight/bella_inventory.py
      - name: Current file inventory
        run: |
          mkdir -p artifacts/bella-sync-2026-09-21
          python3 books/wip_inventory.py > artifacts/bella-sync-2026-09-21/wip.txt
          python3 books/wip_inventory.py --audio > artifacts/bella-sync-2026-09-21/wip-audio.txt
      - name: Inspect remote audio jobs without changing them
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 tools/audio-highlight/runpod_guard.py status --budget 15 --spent 1 --json-out artifacts/bella-sync-2026-09-21/provider-status.json
      - name: Audit published text, audio manifests and timings
        run: python3 -u tools/audio-highlight/bella_inventory.py
      - name: Preserve audit results on this branch only
        if: always()
        run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          git add artifacts/bella-sync-2026-09-21
          git diff --cached --quiet && exit 0
          git commit -m "Record Bella timing audit results [skip ci]"
          git push origin HEAD:codex/bella-sync-repair-20260921
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bella-sync-inventory
          path: artifacts/bella-sync-2026-09-21
          retention-days: 30
