name: Prepare approved Grok openings
on:
  push:
    branches: [codex/grok-openings-release-20260923]
    paths: [.github/workflows/grok-openings-release.yml]
permissions:
  contents: read
concurrency:
  group: grok-openings-release
  cancel-in-progress: false
jobs:
  openings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: bash ../scripts/cloud-setup.sh
      - run: npm run build
      - run: node scripts/plan-grok-openings.mjs
      - run: node --check scripts/check-grok-reader.mjs
      - name: Prepare and verify only the approved twenty openings
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          npx esbuild scripts/warm-grok-openings.mjs --bundle --platform=node --format=esm --outfile=/tmp/tinct-warm-openings.mjs
          node /tmp/tinct-warm-openings.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify real muted Grok reader playback
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_RELEASE_STAGE: '1'
        run: node scripts/check-grok-reader.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-opening-acceptance
          path: app/artifacts/grok-openings
