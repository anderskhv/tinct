name: Prepare structural coordinate evidence
on:
  push:
    branches: [codex/edition-structure-migration-20260924]
    paths: ['app/scripts/prepare-structural-migration.py', '.github/workflows/prepare-structural-migration.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/edition-structure-migration-20260924
      - run: python3 app/scripts/prepare-structural-migration.py
      - name: Commit staged coordinate evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/wip/structure-migration-20260924/
          git diff --cached --quiet || git commit -m "Stage verified structural coordinate maps without publication"
          git push origin HEAD:codex/edition-structure-migration-20260924
