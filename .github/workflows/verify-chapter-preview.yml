name: Chapter Preview acceptance
on:
  pull_request:
    branches: [main]
    paths: ['app/src/lab/LabChapterHeading.tsx', 'app/src/lab/LabChapterEnd.tsx', 'app/src/lab/labChapterEndPaging*', 'app/src/lab/labChapterChat*', 'app/src/lab/LabNativePaginator.tsx', 'app/src/lab/LabDesktopPaginator.tsx', 'app/src/lab/LabPassage.tsx', 'app/src/lab/LabApp.tsx', 'app/src/lab/lab.css', 'app/scripts/check-chapter-preview.cjs', '.github/workflows/verify-chapter-preview.yml']
  workflow_run:
    workflows: [deploy]
    types: [completed]
permissions:
  contents: read
jobs:
  built:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: npx vitest run src/lab/labChapterEndPaging.test.ts src/lab/LabChapterEnd.test.tsx src/lab/labChapterChat.test.ts
      - run: npm run build
      - run: npm run verify-bundle
      - run: npx playwright install --with-deps chromium webkit
      - name: Check chapter actions and complete source coverage
        env:
          TEST_ORIGIN: https://tinct.app
          READER_BUILT: '1'
          ARTIFACT_DIR: artifacts/chapter-preview-built
        run: node scripts/check-chapter-preview.cjs
      - name: Verify page-edge hyphenation with chapter actions
        run: node scripts/check-hyphenation-hardening.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter-preview-built
          path: |
            app/artifacts/chapter-preview-built
            app/artifacts/hyphenation-hardening
  production:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: npx playwright install --with-deps chromium webkit
      - name: Check live chapter actions silently
        env:
          TEST_ORIGIN: https://tinct.app
          ARTIFACT_DIR: artifacts/chapter-preview-production
        run: node scripts/check-chapter-preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter-preview-production
          path: app/artifacts/chapter-preview-production
