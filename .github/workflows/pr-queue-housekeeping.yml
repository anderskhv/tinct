name: Cancel superseded owned PR checks
on:
  push:
    branches: [codex/pr-queue-housekeeping]
    paths: ['.github/workflows/pr-queue-housekeeping.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only recorded obsolete PR runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo='anderskhv/tinct'
          current={"codex/reviewed-library-introductions":"31bb4b7254e71515f82e769ca86b2c69aafa7427","codex/shared-eink-appearance":"4a0a77e2f8e68c6c030f223f5bf21d94a27605e0"}
          ids=[36563195525,36563195432,36563195367,36563195345,36563195300,36562869654,36561664665]
          def api(path, method='GET'):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as response:
                  body=response.read()
                  return json.loads(body) if body else None
          for run_id in ids:
              run=api('actions/runs/'+str(run_id))
              branch=run['head_branch']
              if run['status']=='completed':print(run_id,'already completed');continue
              assert run['event']=='pull_request' and branch in current
              assert run['head_sha']!=current[branch]
              assert api('git/ref/heads/'+branch)['object']['sha']==current[branch], 'Branch advanced; stop and recheck'
              try:
                  api('actions/runs/'+str(run_id)+'/cancel','POST')
                  print(run_id,'cancellation requested')
              except urllib.error.HTTPError as error:
                  if error.code!=409:raise
                  print(run_id,'already completing')
          PY
