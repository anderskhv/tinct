name: Approved reader repair continuation (24 October only)
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: shared-reader-repair-once-20261024
  cancel-in-progress: false
jobs:
  approved-repair:
    if: >-
      github.repository == 'anderskhv/tinct' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'anderskhv/tinct' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.run_attempt == 1 &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write
    steps:
      - name: Continue only the reviewed repair merge before the repair cutoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const run = event.workflow_run
          const repo = 'anderskhv/tinct'
          const repairPR = 609 // Exact reviewed repair PR.
          if (repairPR === 0) { console.log('Inert: repair PR pin pending'); process.exit(0) }
          if (run.event !== 'push' || run.head_branch !== 'main' ||
              run.head_repository.full_name !== repo || run.conclusion !== 'success') throw Error('Untrusted trigger')
          const api = async (method, path, body) => {
            // Native fetch has no automatic request retries. This token is sent
            // only to GitHub; the production GET receives no credentials.
            const response = await fetch('https://api.github.com' + path, {
              method, headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'User-Agent': 'tinct-approved-repair-20261024',
                Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                ...(body ? { 'Content-Type': 'application/json' } : {}) },
              ...(body ? { body: JSON.stringify(body) } : {}),
            })
            if (!response.ok) throw Error(`GitHub ${method} ${path}: HTTP ${response.status}`)
            if (response.status === 204) return undefined
            return response.headers.get('content-type')?.includes('json') ? response.json() : response.arrayBuffer()
          }
          const [main, pr] = await Promise.all([
            api('GET', `/repos/${repo}/git/ref/heads/main`),
            api('GET', `/repos/${repo}/pulls/${repairPR}`),
          ])
          if (!pr.merged || pr.merge_commit_sha !== run.head_sha || main.object.sha !== run.head_sha ||
              pr.base.ref !== 'main' || pr.head.repo.full_name !== repo ||
              pr.head.ref !== 'codex/reader-parity-repair-20261024') {
            console.log('Inert: this is not the one reviewed repair merge')
            process.exit(0)
          }
          const file = await api('GET', `/repos/${repo}/contents/scripts/shared-reader-repair-once.mjs?ref=${run.head_sha}`)
          if (file.sha !== 'df2c6ad4f6815bf5110ed8ddc0a2c2defb21670a' || file.encoding !== 'base64') {
            throw Error('Repair helper blob is not pinned to its final review')
          }
          const { releaseRepairOnce } = await import('data:text/javascript;base64,' + file.content.replace(/\s/g, ''))
          const result = await releaseRepairOnce({ api,
            fetchLive: async url => {
              const response = await fetch(url, { headers: { 'x-tinct-check': '1', 'Cache-Control': 'no-cache' }, cache: 'no-store' })
              return { status: response.status, text: await response.text() }
            }, log: message => console.log(message),
          }, { verifyRunId: run.id, headSha: run.head_sha, continuationAttempt: Number(process.env.GITHUB_RUN_ATTEMPT) })
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Approved one-time reader repair result\n\n```json\n' + JSON.stringify(result, null, 2) + '\n```\n')
          NODE
