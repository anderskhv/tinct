name: Voice audition — Leo lossless
on:
  push:
    branches: [codex/voice-audition-20260923]
    paths: [.github/workflows/voice-audition.yml]
permissions:
  contents: read
concurrency:
  group: voice-audition-20260923
  cancel-in-progress: false
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate fresh Leo WAV
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python3 <<'PY'
          import json, pathlib, os, urllib.request
          p=pathlib.Path("voice-samples")
          p.mkdir(exist_ok=True)
          text="I am by birth a Genevese, and my family is one of the most distinguished of that republic. My ancestors had been for many years counsellors and syndics, and my father had filled several public situations with honour and reputation."
          body={"text":text,"voice_id":"leo","language":"en","output_format":{"codec":"wav","sample_rate":24000}}
          req=urllib.request.Request("https://api.x.ai/v1/tts",data=json.dumps(body).encode(),headers={"Authorization":"Bearer "+os.environ["XAI_API_KEY"],"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=180) as r: data=r.read()
              (p/"leo-fresh.wav").write_bytes(data)
              (p/"request.json").write_text(json.dumps(body,indent=2))
              print("Leo WAV saved",flush=True)
          except Exception as e:
              print(type(e).__name__,getattr(e,"code",""),flush=True)
              raise SystemExit(1)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frankenstein-leo-lossless
          path: voice-samples/
          retention-days: 14
          if-no-files-found: error
