name: bella-focused-preflight
on:
  push:
    branches: ['codex/bella-focused-retention-20260921']
    paths: ['tools/audio-highlight/bella_focused_preflight.py', '.github/workflows/bella-focused-preflight.yml']
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p artifacts/bella-focused-retention-2026-09-21
          python3 books/wip_inventory.py > artifacts/bella-focused-retention-2026-09-21/wip.txt
          python3 books/wip_inventory.py --audio > artifacts/bella-focused-retention-2026-09-21/wip-audio.txt
          python3 tools/audio-highlight/bella_focused_preflight.py
      - if: always()
        run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          git add -f artifacts/bella-focused-retention-2026-09-21
          git diff --cached --quiet && exit 0
          git commit -m "Preserve focused retention preflight [skip ci]"
          git push origin HEAD:codex/bella-focused-retention-20260921
