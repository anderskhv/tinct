name: prepare-reviewed-three-book-text
on:
  push:
    branches: [codex/publish-reviewed-three-books-20260923]
    paths:
      - '.github/workflows/prepare-reviewed-three-books.yml'
      - 'app/scripts/prepare-reviewed-editions.py'
      - 'app/scripts/test-prepare-reviewed-editions.py'
      - 'books/wip/three-book-release-20260923.json'
permissions:
  contents: write
concurrency:
  group: prepare-reviewed-three-books
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify offset projection regressions
        run: python3 app/scripts/test-prepare-reviewed-editions.py
      - name: Prepare exact accepted text and character anchors
        run: python3 app/scripts/prepare-reviewed-editions.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Set up cloud checkout
        run: bash scripts/cloud-setup.sh
      - name: Verify character packages against exact edition bytes
        working-directory: app
        run: npx vitest run src/services/characters
      - name: Build and verify bundle
        working-directory: app
        run: |
          npm run build
          npm run verify-bundle
      - name: Commit only the reviewed publication outputs
        run: |
          # The build refreshes sitemap dates in this clean ephemeral checkout.
          git restore -- app/public/sitemap.xml
          python3 - <<'PY'
          import subprocess
          allowed = {
              "app/public/data/editions/the-prince-modern-en.json",
              "app/public/data/editions/julius-caesar-modern-en.json",
              "app/public/data/editions/candide-modern-en.json",
              "app/public/data/characters/the-prince.v1.json",
              "app/public/data/characters/julius-caesar.v1.json",
              "app/public/data/characters/candide.v1.json",
              "app/src/services/characters/characterCards.ts",
              "books/wip/three-book-release-20260923-report.json",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          untracked = set(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines())
          actual = changed | untracked
          if actual != allowed:
              raise SystemExit(f"Unexpected output set: missing={allowed-actual}, extra={actual-allowed}")
          subprocess.run(["git", "add", "--", *sorted(allowed)], check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish accepted three-book text and compatible character anchors"
          git push origin HEAD:codex/publish-reviewed-three-books-20260923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-three-book-publication-report
          path: books/wip/three-book-release-20260923-report.json
