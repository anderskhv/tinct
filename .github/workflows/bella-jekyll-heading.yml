name: bella-jekyll-heading
on:
  push:
    branches: ['codex/bella-jekyll-heading-20260921']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install openai-whisper==20250625 av==18.1.0
      - run: python3 tools/audio-highlight/bella_jekyll_heading.py
      - if: always()
        run: |
          git config user.name tinct-audit
          git config user.email tinct-audit@users.noreply.github.com
          git add -f artifacts/bella-jekyll-heading-2026-09-21
          git diff --cached --quiet && exit 0
          git commit -m "Preserve speaker-name repair evidence and full-chapter independent check [skip ci]"
          git push origin HEAD:codex/bella-jekyll-heading-20260921
