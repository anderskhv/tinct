name: Library cover audit
on:
  pull_request:
    paths: ['app/public/lab/library_2/assets/*.jpg', 'app/public/lab/library_2/cover-assets.js', 'app/scripts/check-library-covers.mjs', '.github/workflows/library-covers.yml']
permissions:
  contents: read
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: bash ../scripts/cloud-setup.sh
      - run: CI=true npm run build && npm run verify-bundle
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-library-covers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-cover-audit
          path: app/artifacts/library-visual
