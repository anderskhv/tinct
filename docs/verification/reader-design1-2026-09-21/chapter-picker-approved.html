<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap">
<div id="chapter-review" aria-label="Chapter picker · final review">
<section class="menu">
<header><button class="title" data-title aria-expanded="false"></button><div class="actions"><button data-search aria-label="Search book and chats"><i data-lucide="search" aria-hidden="true"></i></button><button data-highlights aria-label="All highlights"><i data-lucide="highlighter" aria-hidden="true"></i></button></div></header>
<div class="full-title" hidden></div>
<nav class="crumbs" aria-label="Visible chapter path" hidden></nav>
<div class="viewport"><nav class="tree" aria-label="Chapters"></nav></div>
<section class="overlay" hidden><div class="overlay-head"><i data-lucide="search" aria-hidden="true"></i><input type="search" aria-label="Search book and chat content" placeholder="Search book or chats…"><span class="overlay-title" hidden>Highlights</span><button data-close aria-label="Close"><i data-lucide="x" aria-hidden="true"></i></button></div><div class="scopes"><button data-scope="all">All</button><button data-scope="book">Book</button><button data-scope="chat">Chats</button></div><div class="results" aria-live="polite"></div></section>
</section>
</div>
<style>
#chapter-review{--paper:light-dark(#f4f0e7,#23221e);--ink:light-dark(#343027,#ece5d8);--muted:light-dark(#81796b,#aca495);--line:light-dark(#d0c9bb,#514d43);--gold:light-dark(#896636,#d3b57a);--wash:light-dark(#e7dcc6,#3e3524);--width:360px;--row:34px;color:var(--ink);font:400 13px/1.4 Inter,system-ui,sans-serif;padding:6px}
#chapter-review *{box-sizing:border-box}
#chapter-review .menu{width:100%;max-width:var(--width);margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:8px 12px 10px;position:relative;overflow:hidden}
#chapter-review button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
#chapter-review header{height:42px;display:flex;gap:8px;align-items:center;position:relative;z-index:6}
#chapter-review .title{min-width:0;flex:1;text-align:left;font:500 21px/1.2 'EB Garamond',Georgia,serif;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chapter-review .actions{display:flex;gap:0;flex:none}
#chapter-review .actions button,#chapter-review [data-close]{width:32px;height:40px;display:grid;place-items:center;color:var(--muted)}
#chapter-review svg{width:16px;height:16px;stroke-width:1.5;flex-shrink:0}
#chapter-review .actions button:hover{color:var(--gold)}
#chapter-review .viewport{max-height:430px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:0 5px 0 0;margin-right:-5px;scroll-padding-top:64px}
#chapter-review .tree ul{list-style:none;margin:0;padding:0;position:relative}
#chapter-review .tree li{position:relative;padding:0;margin:0}
#chapter-review .tree ul.nested>li{padding-left:20px}
#chapter-review .node{min-height:var(--row);display:flex;align-items:center;gap:4px;position:relative}
#chapter-review .label{min-width:0;flex:1;min-height:var(--row);display:flex;align-items:center;gap:6px;text-align:left;padding:3px 6px;color:var(--muted)}
#chapter-review .label .text{min-width:0;overflow-wrap:anywhere}
#chapter-review .branch>.node>.label{font:400 16px/1.15 'EB Garamond',Georgia,serif;color:var(--ink)}
#chapter-review .branch>.node>.label>svg{margin-left:auto;width:11px;height:11px}
#chapter-review .branch.open>.node>.label>svg{transform:rotate(90deg)}
#chapter-review .branch:not(.open)>ul{display:none}
#chapter-review .nested .branch>.node>.label{font:400 13px/1.25 Inter,system-ui,sans-serif}
#chapter-review .on-path>.node>.label{font-weight:500!important;color:var(--gold)!important}
#chapter-review .reading>.node{background:var(--wash);border-radius:5px}
#chapter-review .reading>.node>.label{color:var(--ink);font-weight:500}
#chapter-review .reading-icon{width:14px;height:14px;color:var(--gold)}
#chapter-review .picked:not(.reading)>.node{box-shadow:inset 0 0 0 1px var(--line);border-radius:5px}
#chapter-review .curve{position:absolute;left:0;top:0;width:15px;height:17px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);border-bottom-left-radius:8px;pointer-events:none}
#chapter-review .rail{position:absolute;left:-5px;top:0;width:12px;z-index:2;cursor:pointer}
#chapter-review .rail:before{content:'';position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--line)}
#chapter-review .gold-branch{position:absolute;left:0;top:0;width:15px;border-left:1px solid var(--gold);border-bottom:1px solid var(--gold);border-bottom-left-radius:8px;z-index:3;pointer-events:none}
#chapter-review .tags{display:flex;align-items:center;gap:4px;margin-right:6px;flex:none}
#chapter-review .tags button{min-height:var(--row);display:flex;gap:3px;align-items:center;font-size:11px;color:var(--gold);padding:0 2px}
#chapter-review .tags svg{width:12px;height:12px}
#chapter-review .crumbs{position:absolute;top:50px;left:10px;right:10px;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:0 5px;border-radius:7px;padding:3px 8px;background:light-dark(#f4f0e7ed,#23221eed);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 light-dark(#d0c9bb88,#514d4388);font-size:11px;color:var(--muted)}
#chapter-review .crumbs button{min-height:28px;text-align:left}
#chapter-review .crumbs button:last-child{color:var(--gold)}
#chapter-review .crumbs svg{width:9px;height:9px}
#chapter-review .full-title{position:absolute;z-index:8;top:48px;left:10px;right:10px;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font:500 23px/1.2 'EB Garamond',Georgia,serif;box-shadow:0 6px 20px light-dark(#40341c18,#00000040)}
#chapter-review .overlay{position:absolute;inset:8px;z-index:10;background:var(--paper);border-radius:8px;padding:0 4px;display:flex;flex-direction:column}
#chapter-review .overlay-head{display:flex;align-items:center;gap:8px;min-height:42px;border-bottom:1px solid var(--line)}
#chapter-review input{font:inherit;color:var(--ink);background:none;border:0;flex:1;min-width:0;padding:7px 0}
#chapter-review .overlay-title{flex:1;font:500 20px/1.2 'EB Garamond',Georgia,serif}
#chapter-review .scopes{display:flex;gap:12px;padding:5px 0;font-size:12px;color:var(--muted)}
#chapter-review .scopes button{min-height:30px}
#chapter-review .scopes button[aria-pressed=true]{color:var(--gold)}
#chapter-review .results{overflow:auto;min-height:0;padding:6px 0;color:var(--muted);font-size:12px}
#chapter-review .result{display:block;text-align:left;width:100%;padding:10px 0;border-bottom:1px solid var(--line)}
#chapter-review .result small{display:block;font:400 11px/1.4 Inter,system-ui,sans-serif;color:var(--muted);margin-bottom:3px}
#chapter-review .result p{margin:0;color:var(--ink);font:400 17px/1.3 'EB Garamond',Georgia,serif}
#chapter-review [hidden]{display:none!important}
#chapter-review[data-size=mobile]{--row:42px}
@media(pointer:coarse){#chapter-review{--row:44px}#chapter-review .actions button{height:44px;width:34px}#chapter-review input{font-size:16px}}
@media(max-width:350px){#chapter-review .menu{padding-left:10px;padding-right:10px}#chapter-review .tree ul.nested>li{padding-left:16px}#chapter-review .label{padding-left:4px;padding-right:4px}#chapter-review .tags{gap:1px;margin-right:3px}#chapter-review .title{font-size:20px}}
@media(prefers-reduced-transparency:reduce){#chapter-review .crumbs{background:var(--paper);backdrop-filter:none}}
#chapter-review .read-icon{width:12px;height:12px;color:var(--muted);stroke-width:1.5}
#chapter-review svg.progress-pie{display:block;flex:none;width:16px;height:16px;overflow:visible;shape-rendering:geometricPrecision}
#chapter-review .progress-pie .track{fill:var(--line)}
#chapter-review .progress-pie .fill{fill:var(--gold)}
#chapter-review .crumbs{left:0;right:0;border-radius:0;padding-left:20px;padding-right:20px;background:var(--paper)}
</style>

const state={book:'bible',size:'desktop',deep:false};
const open=new Set();let selected='',current='',mode='',scope='all',crumbKey='';
const tree=root.querySelector('.tree'),viewport=root.querySelector('.viewport'),crumbs=root.querySelector('.crumbs');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons=()=>{if(globalThis.lucide)lucide.createIcons();};
function all(nodes,out=[],parents=[]){for(const n of nodes){out.push({...n,parents});if(n.children)all(n.children,out,[...parents,n]);}return out;}
function nodes(){return all(DATA[state.book].nodes);}
function progressPie(percent){
const p=Math.max(0,Math.min(100,percent));
const angle=p/100*Math.PI*2-Math.PI/2;
const x=8+7*Math.cos(angle),y=8+7*Math.sin(angle);
const fill=p===100?'<circle class="fill" cx="8" cy="8" r="7"/>':`<path class="fill" d="M8 8 L8 1 A7 7 0 ${p>50?1:0} 1 ${x.toFixed(4)} ${y.toFixed(4)} Z"/>`;
return `<svg class="progress-pie" viewBox="0 0 16 16" data-tooltip="${p}% read" aria-hidden="true"><circle class="track" cx="8" cy="8" r="7"/>${fill}</svg>`;
}
function markup(list,parent){return `<ul class="${parent?'nested':''}" ${parent?'data-parent="'+parent+'"':''}>${parent?'<button class="rail" data-collapse="'+parent+'" aria-label="Collapse section"></button>':''}${list.map(n=>{const branch=!!n.children,reading=n.id===current,finished=['b-genesis-2','b-genesis-7'].includes(n.id),progress=finished?100:n.id==='b-genesis-4'?28:reading?68:0,path=nodes().find(x=>x.id===current)?.parents.some(x=>x.id===n.id);return `<li data-id="${n.id}" class="${branch?'branch':''} ${open.has(n.id)?'open':''} ${reading?'reading':''} ${path?'on-path':''} ${n.id===selected?'picked':''}">${parent?'<span class="curve"></span>':''}<div class="node"><button class="label" ${branch?'data-toggle':'data-select'}="${n.id}" ${branch?'aria-expanded="'+open.has(n.id)+'"':reading?'aria-current="page"':''} ${!branch?'aria-label="'+esc(n.label)+(reading?', currently reading':'')+(progress?', '+progress+'% read':', unread')+'"':''}><span class="text">${esc(n.label)}</span>${branch?'<i data-lucide="chevron-right" aria-hidden="true"></i>':progress?progressPie(progress):''}</button>${n.chats||n.highlights?`<span class="tags">${n.highlights?'<button data-h="'+n.id+'" aria-label="'+n.highlights+' sample highlights"><i data-lucide="highlighter" aria-hidden="true"></i>'+n.highlights+'</button>':''}${n.chats?'<button data-c="'+n.id+'" aria-label="'+n.chats+' chats"><i data-lucide="message-circle" aria-hidden="true"></i>'+n.chats+'</button>':''}</span>`:''}</div>${branch?markup(n.children,n.id):''}</li>`;}).join('')}</ul>`;}
function lines(){for(const ul of tree.querySelectorAll('ul.nested')){const children=Array.from(ul.children).filter(x=>x.tagName==='LI');const last=children.at(-1);if(!last)continue;const end=last.offsetTop+last.querySelector('.node').offsetHeight/2;const rail=ul.querySelector(':scope>.rail');rail.style.height=Math.max(0,end-8)+'px';for(const li of children){li.querySelector(':scope>.curve').style.height=li.querySelector('.node').offsetHeight/2+'px';}ul.querySelector(':scope>.gold-branch')?.remove();const active=children.find(li=>li.classList.contains('reading')||li.classList.contains('on-path'));if(active){const span=document.createElement('span');span.className='gold-branch';span.style.height=active.offsetTop+active.querySelector('.node').offsetHeight/2+'px';ul.append(span);}}}

function breadcrumb(){if(mode)return;const top=viewport.getBoundingClientRect().top;const leaves=Array.from(tree.querySelectorAll('li:not(.branch)>.node')).filter(x=>x.getBoundingClientRect().height);const near=leaves.find(x=>x.getBoundingClientRect().bottom>top+40);const item=nodes().find(n=>n.id===near?.parentElement.dataset.id);const parents=item?.parents||[];crumbs.hidden=viewport.scrollTop<28||!parents.length;const key=parents.map(n=>n.id).join('|');if(key===crumbKey)return;crumbKey=key;crumbs.innerHTML=parents.map(n=>`<button data-ancestor="${n.id}">${esc(n.label)}</button>`).join('<i data-lucide="chevron-right" aria-hidden="true"></i>');icons();}
function locate(id){const target=tree.querySelector(`[data-id="${id}"]>.node`);if(target)viewport.scrollTop+=target.getBoundingClientRect().top-viewport.getBoundingClientRect().top-64;breadcrumb();}
function resume(){close(false);const item=nodes().find(n=>n.id===current);item.parents.forEach(n=>open.add(n.id));selected=current;draw();requestAnimationFrame(()=>locate(current));}
function setup(){open.clear();const book=DATA[state.book];current=state.book==='bible'&&state.deep?'b-psalms-119':book.current;selected=current;root.dataset.size=state.size;root.style.setProperty('--width',state.size==='mobile'?'360px':'460px');root.querySelector('.title').textContent=book.title;root.querySelector('.title').setAttribute('aria-label','Show full title: '+book.title);root.querySelector('.full-title').textContent=book.title;root.querySelector('.full-title').hidden=true;root.querySelector('.title').setAttribute('aria-expanded','false');crumbKey='';resume();}

function close(focus=true){mode='';root.querySelector('.overlay').hidden=true;root.querySelector('header').inert=false;viewport.inert=false;crumbs.inert=false;if(focus)root.querySelector('[data-search]').focus();}
function search(){const q=root.querySelector('input').value.trim().toLowerCase();root.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scope===scope));let records=[];if(scope!=='chat')records=nodes().filter(n=>!n.children).map(n=>({id:n.id,location:[...n.parents.map(p=>p.label),n.label].join(' · '),text:n.label})).concat(DATA[state.book].passages);if(scope!=='book')records=records.concat(DATA[state.book].chats);records=records.filter(r=>q&&(r.location+' '+r.text).toLowerCase().includes(q)).slice(0,40);root.querySelector('.results').innerHTML=q?(records.map(r=>`<button class="result" data-hit="${r.id}"><small>${esc(r.location)}</small><p>${esc(r.text)}</p></button>`).join('')||'No matches in the preview content.'):'Search chapters, sample passages and available chat text.';}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.title!==undefined){const box=root.querySelector('.full-title');box.hidden=!box.hidden;b.setAttribute('aria-expanded',!box.hidden);}if(d.toggle){open.has(d.toggle)?open.delete(d.toggle):open.add(d.toggle);draw();}if(d.collapse){open.delete(d.collapse);draw();tree.querySelector(`[data-toggle="${d.collapse}"]`)?.focus();}if(d.select){selected=d.select;draw();}if(d.ancestor)locate(d.ancestor);if(d.resume!==undefined)resume();if(d.search!==undefined)overlay('search');if(d.highlights!==undefined||d.h)overlay('highlights',d.h);if(d.c)overlay('chats',d.c);if(d.close!==undefined)close();if(d.scope){scope=d.scope;search();}if(d.hit){const item=nodes().find(n=>n.id===d.hit);item.parents.forEach(n=>open.add(n.id));selected=d.hit;close(false);draw();requestAnimationFrame(()=>locate(d.hit));}});
