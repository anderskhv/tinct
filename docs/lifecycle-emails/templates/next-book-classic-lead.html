<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#ece8e0;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#ece8e0;">{{hook}}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ece8e0;">
<tr><td align="center" style="padding:28px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#fbf8f2;border-radius:10px;">
<tr><td style="padding:0;"><img src="{{art_url}}" alt="{{art_alt}}" width="600" style="display:block;width:100%;max-width:600px;height:auto;border:0;border-radius:10px 10px 0 0;"></td></tr>
<tr><td style="padding:30px 34px 26px 34px;">
<p style="margin:0 0 20px 0;font-family:Georgia, 'Times New Roman', serif;font-size:20px;letter-spacing:-0.6px;color:#1b1814;">tinct</p>
<p style="margin:0 0 14px 0;font-family:Georgia, 'Times New Roman', serif;font-size:15px;line-height:1.55;color:#6a6256;">{{opening_line}}</p>
<h1 style="margin:0 0 14px 0;font-family:Georgia, 'Times New Roman', serif;font-size:27px;line-height:1.2;font-weight:normal;letter-spacing:-0.4px;color:#1b1814;">{{target_title}}</h1>
<p style="margin:0 0 14px 0;font-family:Georgia, 'Times New Roman', serif;font-size:15px;line-height:1.55;color:#6a6256;margin-top:-8px;">{{target_author}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 18px 0;"><tr><td style="border-left:2px solid #c9b98f;padding:2px 0 2px 16px;"><p style="margin:0 0 6px 0;font-family:Georgia, 'Times New Roman', serif;font-size:19px;line-height:1.45;font-style:italic;color:#1b1814;">&ldquo;{{classic_quote}}&rdquo;</p><p style="margin:0;font-family:Georgia, 'Times New Roman', serif;font-size:14px;line-height:1.5;color:#6a6256;">{{classic_source}}, {{classic_context}}</p></td></tr></table>
<p style="margin:0 0 14px 0;font-family:Georgia, 'Times New Roman', serif;font-size:17px;line-height:1.55;color:#1b1814;">{{reason}}</p>
<p style="margin:0 0 14px 0;font-family:Georgia, 'Times New Roman', serif;font-size:17px;line-height:1.55;color:#1b1814;"><em>{{hook}}</em></p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 20px 0;"><tr><td bgcolor="#1d1a16" style="background-color:#1d1a16;border-radius:999px;"><a href="{{start_url}}" style="display:inline-block;padding:13px 26px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:15px;font-weight:600;color:#f4efe4;text-decoration:none;border-radius:999px;">Start reading</a></td></tr></table>
<p style="margin:0 0 14px 0;font-family:Georgia, 'Times New Roman', serif;font-size:13px;line-height:1.55;color:#8a8274;">Quotes are about the book, not about Tinct.</p>
</td></tr>
</table>
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;"><tr><td align="center" style="padding:16px 20px 0 20px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;line-height:18px;color:#8a8274;">{{sender_address}}<br><a href="{{unsubscribe_url}}" style="color:#8a8274;">Stop reading emails</a></td></tr></table>
</td></tr>
</table>
</body>
</html>
