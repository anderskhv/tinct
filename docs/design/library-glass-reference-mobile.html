<script>
(()=>{
 const root=document.getElementById('tinct-glass-mobile');
 const books=JSON.parse(root.parentNode.querySelector('#tg-book-data-mobile').textContent);
 const q=s=>root.querySelector(s), reel=q('.tg-reel'), track=q('.tg-track');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const config={depth:16,atmosphere:42,glass:65};
 let position=2,target=2,selected=-1,raf=0,drag=null,mode=null,world=0,toastTimer;
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const hours=b=>{const v=Math.round(b.words/250/60*2)/2;return v+' '+(v===1?'hour':'hours')};
