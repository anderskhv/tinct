<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = innerWidth, H = innerHeight;
document.documentElement.style.setProperty('--u', (Math.min(W, H) / 100) + 'px');

const params = new URLSearchParams(location.search);
const FRAME_COLOR = params.get('frame') || '#c9541e'; // cosmic orange, like the iPhone 17 Pro

// ---------- renderer / scene ----------
const SS = Number(params.get('ss') || 2); // supersampling: render at SSx, the browser downsamples
const renderer = new THREE.WebGLRenderer({ antialias: SS < 2, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(SS);
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.getElementById('wrap').appendChild(renderer.domElement);

const STAGE = new THREE.Color('#8d8478');
const scene = new THREE.Scene();
// Backdrop is CSS (body background + vignette); only the phone is shaded in WebGL.

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 500);

const key = new THREE.DirectionalLight(0xfff4e6, 2.2);
key.position.set(-14, 30, -10);
scene.add(key);
scene.add(new THREE.HemisphereLight(0xfff8ee, 0x6b6157, 0.55));
// Rim light from behind: draws a bright highlight along the metal edge.
const rim = new THREE.DirectionalLight(0xffffff, 1.6);
rim.position.set(18, 10, -26);
scene.add(rim);

// ---------- phone ----------
// Units: centimetres. Roughly an iPhone 15 Pro.
const PW = 7.16, PH = 14.66, PD = 0.66, PR = 1.12;
const SW = 6.62, SH = SW * (2532 / 1170), SR = 0.96;

function roundedRect(w, h, r) {
  const s = new THREE.Shape();

  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);

}
function planarUV(geo, w, h) {
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / w + 0.5, pos.getY(i) / h + 0.5);
  uv.needsUpdate = true;
  return geo;
}

const phone = new THREE.Group();
const bevel = 0.14;
const bodyGeo = new THREE.ExtrudeGeometry(roundedRect(PW - bevel * 2, PH - bevel * 2, PR - bevel), {
  depth: PD - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 10, curveSegments: 48,
});
bodyGeo.translate(0, 0, -(PD - bevel * 2) / 2);
// Anodised aluminium: less metallic than steel so the colour stays saturated.
const frameMat = new THREE.MeshStandardMaterial({ color: FRAME_COLOR, metalness: 0.7, roughness: 0.17, envMapIntensity: 1.6 });
const body = new THREE.Mesh(bodyGeo, frameMat);
phone.add(body);

const frontZ = PD / 2 + 0.002;
const glass = new THREE.Mesh(
  new THREE.ShapeGeometry(roundedRect(PW - 0.16, PH - 0.16, PR - 0.08), 48),
  new THREE.MeshBasicMaterial({ color: 0x070707 })
);
glass.position.z = frontZ;
phone.add(glass);

// Screen content is composited on a 2D canvas (status bar + app frame + home indicator).
const SCREEN_PX_W = 1170, SCREEN_PX_H = 2532;
const screenCanvas = document.createElement('canvas');
screenCanvas.width = SCREEN_PX_W; screenCanvas.height = SCREEN_PX_H;
const sctx = screenCanvas.getContext('2d');
const screenTex = new THREE.CanvasTexture(screenCanvas);

screenTex.generateMipmaps = true;
screenTex.minFilter = THREE.LinearMipmapLinearFilter;
const screen = new THREE.Mesh(
  planarUV(new THREE.ShapeGeometry(roundedRect(SW, SH, SR), 48), SW, SH),
  new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false })
);
screen.position.z = frontZ + 0.002;
phone.add(screen);

const island = new THREE.Mesh(
  new THREE.ShapeGeometry(roundedRect(2.05, 0.6, 0.3), 24),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
island.position.set(0, SH / 2 - 0.5, frontZ + 0.006);
phone.add(island);

// Side buttons.
function button(x, y, h) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.08, h, 0.3), frameMat);
  m.position.set(x, y, 0); phone.add(m);
}
button(-PW / 2 - 0.02, 4.1, 0.6);
button(-PW / 2 - 0.02, 2.9, 1.0);
button(-PW / 2 - 0.02, 1.6, 1.0);
button(PW / 2 + 0.02, 2.4, 1.6);

// Phone lies on the ground, screen up, top of phone pointing away (-Z).
phone.rotation.x = -Math.PI / 2;
phone.position.y = PD / 2 + 0.01;
// Soft contact shadow: a pre-blurred rounded rect under the phone, offset away from the key light.
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = 512; shadowCanvas.height = 768;
{
  const c = shadowCanvas.getContext('2d');
  c.filter = 'blur(26px)';
  c.fillStyle = 'rgba(40, 28, 16, 0.55)';
  c.beginPath(); c.roundRect(96, 96, 320, 576, 60); c.fill();
  c.filter = 'blur(7px)';
  c.fillStyle = 'rgba(30, 20, 10, 0.45)';
  c.beginPath(); c.roundRect(118, 116, 276, 540, 44); c.fill();
}
const shadowTex = new THREE.CanvasTexture(shadowCanvas);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(PW * 512 / 300, PH * 768 / 560),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2;
shadow.position.set(0.55, 0.002, 0.45);
const turntable = new THREE.Group();
turntable.add(shadow);
turntable.add(phone);
turntable.rotation.y = 0.12;
scene.add(turntable);

// ---------- screen compositing ----------
const imgCache = new Map();

  imgCache.set(src, p);

  return p;
}
const STATUS_H = 162, HOME_H = 0; // px at 3x. App frame fills below the status bar.
function luminance(r, g, b) { return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
function drawStatusBar(bg) {

  sctx.fillRect(0, 0, SCREEN_PX_W, STATUS_H);
  const fg = luminance(...bg) > 140 ? '#111' : '#f4f1ea';
  sctx.fillStyle = fg;
  sctx.font = '600 51px -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif';
  sctx.textBaseline = 'middle';
  sctx.fillText('9:41', 150, 88);
  // signal
  const bx = 850, by = 88;
  for (let i = 0; i < 4; i++) { const h = 14 + i * 9; sctx.fillRect(bx + i * 16, by + 20 - h, 11, h); }
  // wifi
  sctx.lineWidth = 7; sctx.strokeStyle = fg; sctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) { sctx.beginPath(); sctx.arc(950, by + 22, 12 + i * 12, -Math.PI * 0.77, -Math.PI * 0.23); sctx.stroke(); }
  // battery
  sctx.lineWidth = 4; sctx.globalAlpha = 0.45;
  roundRectPath(1000, by - 18, 72, 36, 10); sctx.stroke();
  sctx.fillRect(1076, by - 7, 5, 14);
  sctx.globalAlpha = 1;
  roundRectPath(1006, by - 12, 52, 24, 6); sctx.fill();
}
function roundRectPath(x, y, w, h, r) {
  sctx.beginPath(); sctx.moveTo(x + r, y); sctx.arcTo(x + w, y, x + w, y + h, r); sctx.arcTo(x + w, y + h, x, y + h, r);

const probe = document.createElement('canvas'); probe.width = 4; probe.height = 1;
const pctx = probe.getContext('2d', { willReadFrequently: true });
// The app frame fills the screen below the status bar. A frame that is shorter than
// that (e.g. a cropped device recording) sits at the bottom, and the space above it
// takes the colour of its top edge, feathered into the image so there's no seam.
const APP_H = SCREEN_PX_H - STATUS_H;
function drawApp(img, alpha = 1) {
  const h = img.height * (SCREEN_PX_W / img.width);
  const top = STATUS_H + Math.max(0, APP_H - h);
  sctx.globalAlpha = alpha;
  if (top > STATUS_H) {
    const c = edgeColor(img, false).map(Math.round).join(',');
    sctx.fillStyle = `rgb(${c})`;
    sctx.fillRect(0, 0, SCREEN_PX_W, top + 2);
    sctx.drawImage(img, 0, top, SCREEN_PX_W, h);
    const g = sctx.createLinearGradient(0, top, 0, top + 70);
    g.addColorStop(0, `rgba(${c},1)`); g.addColorStop(1, `rgba(${c},0)`);
    sctx.fillStyle = g;
    sctx.fillRect(0, top, SCREEN_PX_W, 70);

  const d = pctx.getImageData(1, 0, 1, 1).data;
  return [d[0], d[1], d[2]];
}
// Draws app frame `src`, optionally dissolving towards `srcB` by `mix` (0..1).
async function setScreen(src, srcB = null, mix = 0) {
  const img = await loadImage(src);
  const imgB = srcB && mix > 0 ? await loadImage(srcB) : null;
  const top = edgeColor(img, false), bot = edgeColor(img, true);
  if (imgB) { const t2 = edgeColor(imgB, false), b2 = edgeColor(imgB, true); for (let i = 0; i < 3; i++) { top[i] += (t2[i] - top[i]) * mix; bot[i] += (b2[i] - bot[i]) * mix; } }
  sctx.clearRect(0, 0, SCREEN_PX_W, SCREEN_PX_H);
  sctx.fillStyle = `rgb(${bot.map(Math.round).join(',')})`;
  sctx.fillRect(0, 0, SCREEN_PX_W, SCREEN_PX_H);
  drawApp(img);

  drawStatusBar(top.map(Math.round));
  sctx.fillStyle = luminance(...bot) > 140 ? 'rgba(0,0,0,.82)' : 'rgba(255,255,255,.85)';

// ---------- camera shots ----------
// Product-shot framing: the whole phone stays in view. Each shot eases between two
// orbit positions around the phone: az = degrees around (0 = from the phone's bottom
// edge, so text reads upright), el = elevation in degrees, d = distance (cm),
// look = point on the phone (x, z) the camera aims at.
const SHOTS = {
  hero:      { from: { az: -24, el: 56, d: 36.8, look: [0, 0.4] }, to: { az: -14, el: 60, d: 33.9, look: [0, 0.2] } },
  left:      { from: { az: -18, el: 62, d: 32.2, look: [0, -0.2] }, to: { az: -8, el: 64, d: 30.7, look: [0, -0.6] } },
  right:     { from: { az: 20, el: 58, d: 33.4, look: [0, 0.2] }, to: { az: 11, el: 61, d: 31.2, look: [0, 0] } },
  top:       { from: { az: 8, el: 64, d: 32.5, look: [0, -0.9] }, to: { az: -2, el: 66, d: 33, look: [0, -0.8] } },
  bottom:    { from: { az: -10, el: 62, d: 32.5, look: [0, 0.9] }, to: { az: 2, el: 64, d: 31, look: [0, 1.1] } },
  overhead:  { from: { az: 4, el: 74, d: 33.4, look: [0, 0] }, to: { az: -5, el: 76, d: 32.2, look: [0, 0] } },
  reveal:    { from: { az: -6, el: 62, d: 30.7, look: [0, 0] }, to: { az: -22, el: 50, d: 51.2, look: [0, 0.6] } },

    az: lerp(s.from.az, s.to.az, k), el: lerp(s.from.el, s.to.el, k), d: lerp(s.from.d, s.to.d, k),
    lx: lerp(s.from.look[0], s.to.look[0], k), lz: lerp(s.from.look[1], s.to.look[1], k),

// Places the camera on an orbit around the phone (degrees, cm). render-take.mjs drives
// this directly along one continuous spline.
function orbit({ az, el, d, lx = 0, lz = 0, fov = 30, shift = 0.045 }) {
  az *= DEG; el *= DEG;

  const target = new THREE.Vector3(lx, PD, lz).applyAxisAngle(new THREE.Vector3(0, 1, 0), turntable.rotation.y);
  const off = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(d)

const glCanvas = renderer.domElement;

  return true;
};
window.stageReady = document.fonts.ready.then(() => true);
</script>
